<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Plano Devocional — PDF | Equipe Efraim</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  :root{
    --laranja:#FF8126; --pill-bg:#FDE7D4; --pill-tx:#C9681C;
    --fundo:#F2F5F9; --card:#FFFFFF; --escuro:#17181D; --escuro2:#23242A;
    --cinza:#8A9099; --cinza2:#9AA0A8; --zap:#25D366;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  body{background:#DDE2E9; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; color:var(--escuro);}

  /* Barra de controle — some na impressão */
  .controle{
    position:sticky; top:0; z-index:10; background:var(--escuro); border-bottom:1px solid #2A2B31;
    padding:10px 14px 12px;
  }
  .controle .ct{max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:9px;}
  .controle .ct-status{font-size:.74rem; color:#B9BDC4; text-align:center;}
  .controle .ct-acoes{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .controle .ct-acoes button{
    display:flex; align-items:center; justify-content:center; gap:7px; padding:12px 8px;
    border:none; border-radius:12px; cursor:pointer; color:#fff;
    font-family:inherit; font-size:.8rem; font-weight:700; letter-spacing:.2px; line-height:1;
  }
  .controle .ct-acoes button svg{width:18px; height:18px; flex:none; fill:currentColor;}
  .controle .ct-acoes .pdf{background:var(--laranja); box-shadow:0 4px 16px rgba(255,129,38,.28);}
  .controle .ct-acoes .zap{background:var(--zap); box-shadow:0 4px 16px rgba(37,211,102,.28);}
  .controle .ct-acoes button:active{transform:scale(.98);}
  .controle .ct-acoes button:disabled{opacity:.5; cursor:default;}
  .controle .ct-sec{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .controle .ct-formato{display:inline-flex; border:1px solid #3A3B42; border-radius:999px; padding:3px; gap:2px;}
  .controle .ct-formato a{padding:6px 14px; border-radius:999px; font-size:.72rem; font-weight:600; color:#B9BDC4; text-decoration:none;}
  .controle .ct-formato a.ativo{background:rgba(255,129,38,.18); color:var(--laranja);}
  .controle .ct-voltar{font-size:.74rem; color:#B9BDC4; text-decoration:none; padding:6px 4px;}
  .controle .ct-voltar:hover{color:var(--laranja);}

  .folha{margin:18px auto; }
  .pagina{background:var(--fundo); box-shadow:0 6px 26px rgba(0,0,0,.22); margin:0 auto 16px;}

  /* ============ STORY (WhatsApp) ============ */
  body.story .pagina{width:323pt; height:699pt; padding:14pt;}
  /* durante a paginação a página fica sempre no tamanho do PDF, em qualquer tela */
  body.medindo .pagina{width:323pt !important; height:699pt !important; padding:14pt !important;}

  .cab{background:var(--escuro); border-radius:14pt; padding:13pt 14pt; display:flex; align-items:center;}
  .cab img{width:30pt; margin-right:11pt;}
  .cab .et{font-size:6pt; color:#B9BDC4; letter-spacing:2.2pt;}
  .cab h1{font-size:15pt; color:#fff; line-height:1.2; margin-top:3pt; font-weight:700;}
  .cab h1 .o{color:var(--laranja);}

  .cob{background:var(--escuro2); border-radius:14pt; padding:12pt 14pt; margin-top:9pt;}
  .cob .et{font-size:5.6pt; color:#8E939B; letter-spacing:2.2pt;}
  .cob .ps{font-size:11pt; color:#fff; font-weight:700; margin-top:4pt;}
  .cob .vs{font-size:6.4pt; color:#9DA2AA; line-height:1.65; margin-top:8pt; font-style:italic;}
  .cob .vs b{font-style:normal; color:var(--laranja);}

  .st{margin-top:9pt;}
  .st .lin{display:flex; margin-bottom:8pt;}
  .st .b{background:var(--card); border-radius:12pt; padding:9pt 11pt; flex:1; min-width:0;}
  .st .b:first-child{margin-right:8pt;}
  .st .b .et{font-size:5.4pt; color:var(--cinza2); letter-spacing:1.8pt;}
  .st .b .v{font-size:13pt; font-weight:700; margin-top:3pt;}
  .st .b .v.pq{font-size:8.5pt; line-height:1.3;}

  .marca{background:var(--escuro); border-radius:14pt; padding:11pt 14pt; display:flex; align-items:center;}
  .marca img{width:24pt; margin-right:10pt;}
  .marca b{font-size:11pt; color:#fff;}
  .marca .ar{font-size:6.6pt; color:var(--laranja); margin-left:6pt;}
  .marca .aps{font-size:5.6pt; color:#8E939B; margin-top:3pt;}

  .tit{font-size:7pt; color:var(--laranja); letter-spacing:2.4pt; font-weight:700; margin:9pt 0 6pt 4pt;}

  /* Cartão da leitura: data, obreiro e referência em uma linha, com letra grande */
  .c{background:var(--card); border-radius:10pt; padding:6.5pt 10pt; margin-bottom:4pt; display:flex; align-items:center; gap:9pt;}
  .c .d{flex:none; min-width:36pt; text-align:center; font-size:10pt; font-weight:700; line-height:1.1;}
  .c .d small{display:block; font-size:6pt; font-weight:600; color:var(--cinza); letter-spacing:1pt; text-transform:uppercase; margin-top:1.5pt;}
  .c .n{flex:1; min-width:0; font-size:11.5pt; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .c .r{flex:none; background:var(--pill-bg); color:var(--pill-tx); border-radius:20pt;
        padding:3pt 8pt; font-size:7.6pt; font-weight:700; white-space:nowrap;}
  .c.hoje{border:1.2pt solid var(--laranja);}
  .c.hoje .r{background:var(--laranja); color:#fff;}

  /* No celular a página corre solta na largura da tela (o PDF continua 323×699pt) */
  @media screen and (max-width:480px){
    body.story .folha{margin:12px 10px;}
    body.story .pagina{width:auto; height:auto; padding:12pt;}
  }

  /* ============ A4 (impressão) ============ */
  body.a4 .pagina{width:210mm; min-height:297mm; padding:12mm 11mm 13mm; background:#fff;}
  body.a4 .cab{border-radius:5mm; padding:6mm 7mm; margin-bottom:5mm;}
  body.a4 .cab img{width:17mm; margin-right:7mm;}
  body.a4 .cab .et{font-size:6.5pt; letter-spacing:2.4pt;}
  body.a4 .cab h1{font-size:17pt; margin-top:1.5mm;}
  body.a4 .cab p{font-size:7.6pt; color:#9DA2AA; margin-top:2.5mm; line-height:1.6;}
  body.a4 table{width:100%; border-collapse:separate; border-spacing:0 1mm; font-size:8.5pt;}
  body.a4 th{background:var(--escuro2); color:var(--laranja); text-align:left; padding:2.4mm 3mm;
             font-size:6.6pt; letter-spacing:1.6pt;}
  body.a4 th:first-child{border-radius:2mm 0 0 2mm;}
  body.a4 th:last-child{border-radius:0 2mm 2mm 0;}
  body.a4 td{background:var(--fundo); padding:2mm 3mm;}
  body.a4 td:first-child{border-radius:2mm 0 0 2mm;}
  body.a4 td:last-child{border-radius:0 2mm 2mm 0;}
  body.a4 .d{white-space:nowrap; width:24mm; color:#5C626B;}
  body.a4 .w{width:14mm; color:var(--cinza); font-size:7.5pt;}
  body.a4 .n{font-weight:700;}
  body.a4 .pill{background:var(--pill-bg); color:var(--pill-tx); border-radius:20pt;
                padding:1mm 2.6mm; font-size:7pt; font-weight:700;}
  body.a4 .rodape{margin-top:5mm; font-size:7pt; color:var(--cinza2); text-align:center; letter-spacing:.5pt;}

  @media print{
    .controle{display:none !important;}
    body{background:#fff;}
    .folha{margin:0;}
    .pagina{box-shadow:none; margin:0; page-break-after:always;}
    .pagina:last-child{page-break-after:auto;}
    body.a4 thead{display:table-header-group;}
    body.a4 tr{page-break-inside:avoid;}
  }
  @page{margin:0;}
</style>
</head>
<body>

<div class="controle"><div class="ct">
  <div class="ct-status" id="status">Carregando o plano...</div>
  <div class="ct-acoes">
    <button type="button" class="pdf" onclick="window.print()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V9h5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 11.5v6.5m-3-3 3 3 3-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

    </button>
    <button type="button" class="zap" id="btn-zap" onclick="enviarWhats()" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.885-9.885 9.885m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
      Enviar no WhatsApp
    </button>
  </div>
  <div class="ct-sec">
    <div class="ct-formato" id="formato">
      <a href="devocional-pdf.html?f=story" data-f="story">📱 Story</a>

    <a class="ct-voltar" href="devocional.html">← voltar</a>
  </div>
</div></div>

<div class="folha" id="folha"></div>
<img src="logo1.png" id="logo-fonte" style="display:none" alt="">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
/* ================================================================
   Gera o plano devocional para impressão, a partir do banco.
   ?f=story  → páginas 323×699pt, para mandar no WhatsApp
   ?f=a4     → tabela completa em A4, para imprimir
   O navegador faz o PDF: "Salvar como PDF" no diálogo de impressão.
   "Enviar no WhatsApp" abre o WhatsApp com as leituras da semana em texto.
   Segue o modelo do devocional impresso da equipe (fundo claro).
   ================================================================ */

const FORMATO = (new URLSearchParams(location.search).get("f") || "story").toLowerCase() === "a4" ? "a4" : "story";
document.body.className = FORMATO;

let PLANO = [];

const ABREV = {"Mateus":"Mt","Marcos":"Mc","Lucas":"Lc","João":"Jo","Atos":"At","Romanos":"Rm",
  "1 Coríntios":"1Co","2 Coríntios":"2Co","Gálatas":"Gl","Efésios":"Ef","Filipenses":"Fp",
  "Colossenses":"Cl","1 Tessalonicenses":"1Ts","2 Tessalonicenses":"2Ts","1 Timóteo":"1Tm",
  "2 Timóteo":"2Tm","Tito":"Tt","Filemom":"Fm","Hebreus":"Hb","Tiago":"Tg","1 Pedro":"1Pe",
  "2 Pedro":"2Pe","1 João":"1Jo","2 João":"2Jo","3 João":"3Jo","Judas":"Jd","Apocalipse":"Ap"};

function hojeISO(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function br(iso){ return iso.split("-").reverse().join("/"); }
function dm(iso){ const p = iso.split("-"); return p[2]+"/"+p[1]; }
function diaSemana(iso){
  return new Date(iso+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short"}).replace(".","");
}
function ref(l){ return l.referencia.replace("-", " "); }

/* A logo entra recortada, para o PDF sair fiel ao modelo */
function logoPronta(){
  return new Promise(resolve => {
    const img = document.getElementById("logo-fonte");
    function processa(){
      try{
        const c = document.createElement("canvas");
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        const ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const d = ctx.getImageData(0,0,c.width,c.height), p = d.data;
        let minX=c.width, minY=c.height, maxX=0, maxY=0;
        for(let i=0;i<p.length;i+=4){
          const mx=Math.max(p[i],p[i+1],p[i+2]), mn=Math.min(p[i],p[i+1],p[i+2]);
          const a=Math.max(0,Math.min(255,(mx-mn-6)*2.2));
          p[i+3]=a;
          if(a>40){ const px=(i/4)%c.width, py=Math.floor((i/4)/c.width);
            if(px<minX)minX=px; if(px>maxX)maxX=px; if(py<minY)minY=py; if(py>maxY)maxY=py; }
        }
        if(maxX<=minX||maxY<=minY){ resolve(img.src); return; }
        ctx.putImageData(d,0,0);
        const pad=40, sx=Math.max(0,minX-pad), sy=Math.max(0,minY-pad);
        const sw=Math.min(c.width,maxX+pad)-sx, sh=Math.min(c.height,maxY+pad)-sy;
        const c2=document.createElement("canvas"); c2.width=sw; c2.height=sh;
        c2.getContext("2d").drawImage(c,sx,sy,sw,sh,0,0,sw,sh);
        resolve(c2.toDataURL("image/png"));
      }catch(e){ resolve(img.src); }
    }
    if(img.complete && img.naturalWidth>0) processa(); else img.onload = processa;
  });
}
/* Garante que a logo recortada já esteja decodificada antes de medir as páginas */
function imagemPronta(src){
  return new Promise(resolve => { const im = new Image(); im.onload = im.onerror = () => resolve(); im.src = src; });
}

function cartao(l, hoje){
  return '<div class="c' + (l.data === hoje ? " hoje" : "") + '">' +
    '<div class="d">' + dm(l.data) + '<small>' + diaSemana(l.data) + '</small></div>' +
    '<div class="n">' + l.nome + '</div>' +
    '<div class="r">' + ref(l) + '</div></div>';
}

/* ---------------- STORY ---------------- */
function capaStory(plano, logo){
  const livros = [...new Set(plano.map(l => l.livro))];
  const pessoas = new Set(plano.map(l => l.nome)).size;
  const periodo = dm(plano[0].data) + " -> " + dm(plano[plano.length-1].data);
  const abrev = livros.map(l => ABREV[l] || l).join(" • ");

  return '<div class="cab"><img src="' + logo + '">' +
      '<div><div class="et">PLANO DEVOCIONAL</div>' +
      '<h1>Equipe 02 Efraim<br><span class="o">(frutífera)</span></h1></div></div>' +
    '<div class="cob"><div class="et">COBERTURA PASTORAL</div>' +
      '<div class="ps">Pr. Joel &amp; Pra. Vilma</div>' +
      '<div class="vs">“Eu sou a videira, vós as varas; quem está em mim, e eu nele, esse dá muito fruto.” <b>João 15:5</b></div></div>' +
    '<div class="st">' +
      '<div class="lin">' +
        '<div class="b"><div class="et">PARTICIPANTES</div><div class="v">' + pessoas + '</div></div>' +
        '<div class="b"><div class="et">PERÍODO</div><div class="v pq">' + periodo + '</div></div>' +
      '</div><div class="lin">' +
        '<div class="b"><div class="et">SEQUÊNCIA</div><div class="v pq">' + plano.length + ' leituras</div></div>' +
        '<div class="b"><div class="et">LIVROS</div><div class="v pq">' + abrev + '</div></div>' +
      '</div></div>' +
    '<div class="marca"><img src="' + logo + '">' +
      '<div><div><b>Aliançados</b><span class="ar">@ aliancados_br</span></div>' +
      '<div class="aps">Ap.denilsonfonseca &nbsp; Ap.elisafonseca</div></div></div>' +
    '<div class="tit">PRÓXIMAS LEITURAS</div>';
}

/* Pagina medindo de verdade: cada cartão entra na página enquanto couber,
   sempre no tamanho do PDF (323×699pt), em qualquer tela. */
function montarStory(plano, logo){
  const hoje = hojeISO();
  const folha = document.getElementById("folha");
  folha.innerHTML = "";
  document.body.classList.add("medindo");

  function novaPagina(html){
    const p = document.createElement("div");
    p.className = "pagina"; p.innerHTML = html || "";
    folha.appendChild(p); return p;
  }
  function cabe(p, el){
    const limite = p.getBoundingClientRect().bottom - parseFloat(getComputedStyle(p).paddingBottom);
    return el.getBoundingClientRect().bottom <= limite + 0.5;
  }

  let pag = novaPagina(capaStory(plano, logo));
  plano.forEach(l => {
    pag.insertAdjacentHTML("beforeend", cartao(l, hoje));
    const el = pag.lastElementChild;
    if(!cabe(pag, el)){ pag = novaPagina(); pag.appendChild(el); }
  });
  document.body.classList.remove("medindo");
}

/* ---------------- A4 ---------------- */
function montarA4(plano, logo){
  const hoje = hojeISO();
  const linhas = plano.map(l =>
    '<tr><td class="d">' + br(l.data) + '</td><td class="w">' + diaSemana(l.data) + '</td>' +
    '<td><span class="pill">' + ref(l) + '</span></td>' +
    '<td class="n">' + l.nome + '</td></tr>').join("");

  return '<div class="pagina">' +
    '<div class="cab"><img src="' + logo + '">' +
      '<div><div class="et">PLANO DEVOCIONAL</div>' +
      '<h1>Equipe 02 Efraim <span class="o">(frutífera)</span></h1>' +
      '<p>Novo Testamento · ' + plano.length + ' leituras · de ' + br(plano[0].data) +
        ' a ' + br(plano[plano.length-1].data) + '<br>' +
        'Cobertura pastoral: Pr. Joel &amp; Pra. Vilma · Ap. Denilson &amp; Ap. Elisa Fonseca</p></div></div>' +
    '<table><thead><tr><th>DATA</th><th>DIA</th><th>LEITURA</th><th>OBREIRO(A)</th></tr></thead>' +
    '<tbody>' + linhas + '</tbody></table>' +
    '<div class="rodape">Aliançados · Lugar de Crescimento · equipeefraim.com.br</div>' +
  '</div>';
}

/* ---------------- WhatsApp: as leituras da semana, em texto ---------------- */
function enviarWhats(){
  if(!PLANO.length) return;
  const hoje = hojeISO();
  let i = PLANO.findIndex(l => l.data >= hoje);
  if(i < 0) i = Math.max(0, PLANO.length - 7);
  const semana = PLANO.slice(i, i + 7);
  const linhas = semana.map(l => "• *" + diaSemana(l.data) + " " + dm(l.data) + "* · " + l.nome + " · " + ref(l));
  const msg =
    "📖 *PLANO DEVOCIONAL · Equipe 02 Efraim*\n" +
    "_Leituras da semana_\n\n" +
    linhas.join("\n") + "\n\n" +
    "🙏 Ore pelo obreiro do dia e leia junto.\n" +
    "Plano completo, lembrete e marcação de leitura:\n" +
    "https://equipeefraim.com.br/devocional.html";
  window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank", "noopener");
}

/* ---------------- Início ---------------- */
(async function(){
  const perfil = await exigirLogin();
  if(!perfil) return;

  document.querySelectorAll("#formato a").forEach(a => a.classList.toggle("ativo", a.dataset.f === FORMATO));
  const status = document.getElementById("status");
  try{
    const { data: plano, error } = await sb.from("devocional")
      .select("data,livro,capitulo,referencia,nome").order("data");
    if(error || !plano || !plano.length) throw new Error("O plano ainda não foi carregado no banco.");
    PLANO = plano;

    const logo = await logoPronta();
    await imagemPronta(logo);
    if(FORMATO === "a4") document.getElementById("folha").innerHTML = montarA4(plano, logo);
    else montarStory(plano, logo);

    status.textContent = plano.length + " leituras · " + br(plano[0].data) + " a " + br(plano[plano.length-1].data);
    document.getElementById("btn-zap").disabled = false;
  }catch(e){
    status.textContent = e.message;
  }
})();
</script>
</body>
