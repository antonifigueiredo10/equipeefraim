<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B0B0D">
<meta name="robots" content="noindex,nofollow">
<title>Escala da Semana — Equipe Efraim | Aliançados</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">

<style>
  :root{
    --laranja:#F0834A; --laranja-claro:#F9A56E; --laranja-escuro:#D96A32;
    --preto:#0B0B0D; --preto-card:#151518; --cinza-borda:#2A2A2F;
    --branco:#F7F3EE; --texto-suave:#B8B2AA; --verde:#3DBB7A; --vermelho:#E05555;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--preto); color:var(--branco);
    font-family:'Poppins',system-ui,sans-serif; min-height:100vh;
    background-image:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(240,131,74,.18), transparent 60%);
  }

  /* Cabeçalho compacto: logo e título lado a lado */
  .hero{display:flex; align-items:center; gap:14px; max-width:600px; margin:0 auto; padding:16px 18px 0;}
  .hero .logo{
    width:64px; height:64px; flex:none; object-fit:cover; object-position:50% 45%;
    border-radius:50%; border:1px solid rgba(240,131,74,.4); box-shadow:0 0 28px rgba(240,131,74,.28);
  }
  .hero .logo.recortada{width:auto; height:64px; max-width:84px; object-fit:contain; border-radius:0; border:none; box-shadow:none;}
  .hero h1{font-family:'Playfair Display',serif; font-weight:800; font-size:clamp(1.25rem,5vw,1.7rem); letter-spacing:1px; line-height:1.15;}
  .hero h1 span{color:var(--laranja);}
  .hero .lema{color:var(--texto-suave); font-size:.66rem; letter-spacing:2.5px; text-transform:uppercase; margin-top:4px; font-weight:300;}

  main{max-width:600px; margin:0 auto; padding:14px 18px 50px;}

  /* Seletor dos cultos da semana */
  .cultos{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .cultos button{
    background:var(--preto-card); border:1px solid var(--cinza-borda); border-radius:14px; padding:10px 6px 9px;
    color:var(--texto-suave); font-family:'Poppins',sans-serif; cursor:pointer; text-align:center; line-height:1.2;
  }
  .cultos button small{display:block; font-size:.62rem; letter-spacing:1.5px; text-transform:uppercase;}
  .cultos button b{display:block; font-size:1.05rem; color:var(--branco); margin:2px 0 1px;}
  .cultos button i{display:block; font-style:normal; font-size:.7rem;}
  .cultos button.ativo{border-color:var(--laranja); background:linear-gradient(160deg, rgba(240,131,74,.22), var(--preto-card) 65%); color:var(--laranja);}
  .cultos button.ativo b{color:var(--laranja-claro);}
  .cultos button.passou{opacity:.55;}

  .titulo-culto{text-align:center; margin:16px 0 10px;}
  .titulo-culto b{display:block; font-family:'Playfair Display',serif; font-size:1.25rem;}
  .titulo-culto span{font-size:.72rem; color:var(--texto-suave); letter-spacing:2px; text-transform:uppercase;}

  .infos{display:flex; gap:6px; flex-wrap:wrap;}
  .infos .chip{
    flex:1 1 100%; background:var(--preto-card); border:1px solid var(--cinza-borda); border-radius:12px;
    padding:8px 12px; font-size:.72rem; color:var(--texto-suave); text-align:center; line-height:1.45;
  }
  .infos .chip b{color:var(--branco); display:inline; margin-right:5px; font-size:.72rem;}

  .minha{
    margin-top:10px; background:linear-gradient(135deg, rgba(61,187,122,.2), var(--preto-card) 60%);
    border:1px solid rgba(61,187,122,.6); border-radius:14px; padding:12px 16px; font-size:.82rem; line-height:1.5;
  }
  .minha b{color:var(--verde); display:block; font-size:.66rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:3px;}
  .minha span{color:var(--branco); font-weight:600;}

  .secao{
    font-family:'Playfair Display',serif; color:var(--laranja); font-size:1rem;
    margin:22px 4px 10px; text-align:center; letter-spacing:.5px;
  }
  .faixa{background:linear-gradient(90deg,transparent,var(--laranja),transparent); height:1px; max-width:300px; margin:6px auto 0; opacity:.5;}

  .card{
    background:var(--preto-card); border:1px solid var(--cinza-borda);
    border-radius:14px; padding:11px 14px; margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center; gap:14px;
  }
  .card.sua{border-color:rgba(61,187,122,.6); background:linear-gradient(120deg, rgba(61,187,122,.12), var(--preto-card) 55%);}
  .card .funcao{font-size:.7rem; font-weight:600; color:var(--laranja); text-transform:uppercase; letter-spacing:1.3px; flex:1; line-height:1.35;}
  .card .funcao small{display:block; text-transform:none; letter-spacing:0; font-weight:300; color:var(--texto-suave); font-size:.68rem; margin-top:2px;}
  .card .nomes{flex:1.3; text-align:right; font-size:.88rem; font-weight:600; line-height:1.45;}
  .card .nomes small{display:block; font-weight:300; color:var(--texto-suave); font-size:.72rem;}
  .casal{
    display:inline-block; background:rgba(240,131,74,.12); border:1px solid rgba(240,131,74,.35);
    color:var(--laranja-claro); border-radius:999px; padding:1px 9px;
    font-size:.64rem; font-weight:600; margin-left:5px; vertical-align:middle;
  }
  .todos{color:var(--laranja); letter-spacing:2px;}
  .aviso{
    background:rgba(224,85,85,.08); border:1px solid rgba(224,85,85,.3);
    color:#EFA0A0; border-radius:12px; padding:12px 16px; font-size:.76rem;
    text-align:center; margin-top:14px; line-height:1.6;
  }
  .lideranca{text-align:center; margin-top:14px; font-size:.74rem; color:var(--texto-suave); line-height:1.6;}
  .lideranca b{color:var(--branco);}
  .voltar{
    display:block; text-align:center; margin:26px auto 0; max-width:280px;
    padding:13px; border:1px solid var(--laranja); border-radius:999px;
    color:var(--laranja); text-decoration:none; font-weight:600; font-size:.85rem; letter-spacing:1px;
  }
  .voltar:hover{background:rgba(240,131,74,.1);}
  /* ---- Edição dos nomes das posições (só liderança) ---- */
  .btn-editar-nomes{
    display:block; margin:12px auto 0; padding:9px 18px; border-radius:999px; cursor:pointer;
    border:1px dashed var(--laranja); background:transparent; color:var(--laranja); font:600 .76rem 'Poppins',sans-serif;
  }
  .barra-edicao{
    position:sticky; top:60px; z-index:20; margin-top:12px; padding:10px 12px; border-radius:14px;
    background:#1D1D22; border:1px solid var(--laranja); box-shadow:0 8px 26px rgba(0,0,0,.5);
    font-size:.72rem; color:var(--texto-suave); line-height:1.45;
  }
  .barra-edicao b{color:var(--laranja-claro);}
  .barra-edicao .be-btns{display:flex; gap:8px; margin-top:8px;}
  .barra-edicao button{flex:1; padding:10px; border-radius:10px; cursor:pointer; font:700 .76rem 'Poppins',sans-serif; letter-spacing:.5px;}
  .barra-edicao .be-salvar{border:none; color:#fff; background:linear-gradient(135deg, var(--laranja), var(--laranja-escuro));}
  .barra-edicao .be-cancelar{border:1px solid var(--cinza-borda); background:transparent; color:var(--texto-suave);}
  .barra-edicao button:disabled{opacity:.6;}
  .barra-edicao .be-msg{margin-top:6px; color:var(--vermelho);}
  input.ed{
    width:100%; padding:8px 10px; border:1px solid var(--laranja); border-radius:10px; background:#0F0F12;
    color:var(--branco); font:600 .8rem 'Poppins',sans-serif; text-transform:none; letter-spacing:0;
  }
  input.ed:focus{outline:none; box-shadow:0 0 0 2px rgba(240,131,74,.35);}
  .secao input.ed{text-align:center; font-family:'Playfair Display',serif; font-size:.95rem; color:var(--laranja-claro);}
  .card .funcao .orig{display:block; font-size:.62rem; color:var(--texto-suave); text-transform:none; letter-spacing:0; font-weight:300; margin-top:3px;}
  .salvo-ok{
    margin-top:12px; padding:10px 12px; border-radius:12px; text-align:center; font-size:.78rem; font-weight:600;
    background:rgba(61,187,122,.12); border:1px solid rgba(61,187,122,.4); color:var(--verde);
  }

  footer{text-align:center; padding:26px 20px 36px; color:var(--texto-suave); font-size:.7rem; letter-spacing:2px; text-transform:uppercase; font-weight:300;}
  footer span{color:var(--laranja);}

  @media (max-width:520px){
    .hero{padding:14px 14px 0; gap:12px;}
    .hero .logo{width:56px; height:56px;}
    .hero .logo.recortada{width:auto; height:56px; max-width:74px;}
    main{padding:12px 12px 40px;}
    .card{flex-direction:column; align-items:flex-start; gap:4px;}
    .card .nomes{text-align:left; font-size:.85rem;}
  }
</style>
</head>
<body>

<div class="hero">
  <img src="logo1.png" alt="Aliançados" class="logo" id="logo-img">
  <div>
    <h1>ESCALA DA <span>SEMANA</span></h1>
    <div class="lema">Equipe 02 Efraim · Obreiros</div>

</div>

<main>
  <div class="cultos" id="cultos"></div>
  <div id="conteudo"></div>
  <a class="voltar" href="index.html" id="voltar" style="display:none">← Painel da liderança</a>

<footer>Aliançados · <span>Lugar de Crescimento</span> · 2026 · equipeefraim.com.br</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
/* ================================================================
   Escala da semana da Equipe 02 (dom 18h → qua 19h30 → dom 9h).
   Os dados (ESCALAS) ficam no config.js, porque o Início do devocional
   e o painel da liderança também usam as datas. Para publicar a próxima
   escala, troque ESCALAS lá (a mesma lista do Excel/PDF da pasta ALIANÇADOS).
   ================================================================ */
const LIDERANCA = "Líderes: Clebson e Letícia · Colíderes: Antônio e Laura";
const AVISOS = [
  "Não se aglomerar perto da mesa de apoio: é corredor de acesso aos banheiros e ao gabinete.",
  "Distribuam-se por toda a lateral e fundo da igreja. Evitar conversas paralelas.",
  "Não permitir que crianças fiquem correndo, orientando sempre os pais quando ocorrer.",
  "Horário de chegada: 1 hora antes do culto."
];
/* ---------- Nomes das posições trocados pela liderança ----------
   Ficam numa linha reservada da tabela do devocional (data 2000-01-01, livro "__config_escala__").
   O plano devocional ignora essa linha, porque só mostra leituras a partir de INICIO_PLANO.
   Assim a liderança muda os nomes pelo app, sem nenhuma mudança no banco.
   A chave é o nome original da posição: vale em todos os cultos em que ela aparece. */
const CONFIG_ESCALA = { data: "2000-01-01", livro: "__config_escala__" };
let NOMES_POSICOES = {};
let EDITANDO = false, CULTO_ATUAL = 0, PENDENTE = {}, SALVO_AGORA = false;
async function carregarNomesPosicoes(){
  try{
    const { data } = await sb.from("devocional").select("referencia")
      .eq("data", CONFIG_ESCALA.data).eq("livro", CONFIG_ESCALA.livro).maybeSingle();
    const m = data && data.referencia ? JSON.parse(data.referencia) : {};
    NOMES_POSICOES = (m && typeof m === "object" && !Array.isArray(m)) ? m : {};
  }catch(e){ NOMES_POSICOES = {}; }
}
function nomePosicao(n){ return NOMES_POSICOES[n] || n; }
async function salvarNomesPosicoes(mapa){
  const { error } = await sb.from("devocional").upsert({
    data: CONFIG_ESCALA.data, livro: CONFIG_ESCALA.livro, capitulo: 0,
    referencia: JSON.stringify(mapa), nome: "__config__", testamento: "NOVO"
  }, { onConflict: "data" });
  if(error) throw error;
}
/* guarda o que foi digitado antes de trocar de culto ou salvar */
function guardarDigitado(){
  document.querySelectorAll("#conteudo input.ed").forEach(inp => { PENDENTE[inp.dataset.orig] = inp.value; });
}
function editarNomes(){ EDITANDO = true; PENDENTE = {}; SALVO_AGORA = false; montar(CULTO_ATUAL); }
function cancelarEdicao(){ EDITANDO = false; PENDENTE = {}; montar(CULTO_ATUAL); }
async function salvarEdicao(btn){
  guardarDigitado();
  const mapa = Object.assign({}, NOMES_POSICOES);
  Object.keys(PENDENTE).forEach(orig => {
    const novo = String(PENDENTE[orig] || "").trim();
    if(!novo || novo === orig) delete mapa[orig]; else mapa[orig] = novo;
  });
  btn.disabled = true; btn.textContent = "salvando...";
  try{
    await salvarNomesPosicoes(mapa);
    NOMES_POSICOES = mapa; EDITANDO = false; PENDENTE = {}; SALVO_AGORA = true;
    montar(CULTO_ATUAL);
  }catch(err){
    btn.disabled = false; btn.textContent = "SALVAR";
    const m = document.querySelector(".barra-edicao .be-msg");
    if(m) m.textContent = "Não deu para salvar agora. Confira a internet e tente de novo.";
  }
}
function escAttr(s){ return esc(s).replace(/"/g, "&quot;"); }

/* ---------- utilidades ---------- */
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function normal(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace("jakcson", "jackson").trim(); }
function dataLonga(iso){ const p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
function fimDoCulto(c){ const d = new Date(c.data + "T00:00:00"); d.setHours(0, Math.round((c.inicio + 3) * 60)); return d; }

/* nomes: "(casal)" vira etiqueta; "Lado D · Lado E" quebra em duas linhas; TODOS em destaque */
function nomesHTML(n){
  if(n === "TODOS" || n === "Liderança") return '<span class="todos">' + n.toUpperCase() + '</span>';
  let h = esc(n).replace(/ \(casal\)/g, '<span class="casal">casal</span>');
  if(h.includes(" · Lado E:")){ const [a, b] = h.split(" · "); h = a + "<small>" + b + "</small>"; }
  return h;
}
function ehMinha(n){
  if(!PERFIL || !PERFIL.nome) return false;
  const eu = normal(PERFIL.nome);
  return eu.length > 2 && normal(n).includes(eu);
}

function montar(i){
  if(EDITANDO) guardarDigitado();
  CULTO_ATUAL = i;
  const c = ESCALAS[i];
  document.querySelectorAll("#cultos button").forEach((b, j) => b.classList.toggle("ativo", j === i));
  const minhas = [];
  let html = '<div class="titulo-culto"><b>' + c.dia + ', ' + dataLonga(c.data).slice(0, 5) + ' · ' + c.hora + '</b><span>' + esc(c.culto) + '</span></div>' +
    '<div class="infos">' +
      '<div class="chip"><b>⏰ Chegada</b>' + c.chegada + ' (1 hora antes)</div>' +
      '<div class="chip"><b>👕 Uniforme</b>' + esc(c.uniforme) + '</div>' +
    '</div>';
  if(EDITANDO){
    html += '<div class="barra-edicao">✏️ <b>Editando os nomes das posições.</b> O nome novo vale em todos os cultos em que a posição aparece. ' +
            'Deixe o campo vazio para voltar ao nome original.' +
            '<div class="be-btns"><button type="button" class="be-cancelar" onclick="cancelarEdicao()">CANCELAR</button>' +
            '<button type="button" class="be-salvar" onclick="salvarEdicao(this)">SALVAR</button></div><div class="be-msg"></div></div>';
  }else if(typeof EH_LIDER === "function" && EH_LIDER()){
    if(SALVO_AGORA){ html += '<div class="salvo-ok">✅ Nomes das posições salvos. A equipe já vê os nomes novos.</div>'; SALVO_AGORA = false; }
    html += '<button type="button" class="btn-editar-nomes" onclick="editarNomes()">✏️ Editar nomes das posições</button>';
  }
  let cartoes = "";
  /* no modo edição, o campo mostra o que já foi digitado (ou o nome atual) */
  const valorEd = orig => (orig in PENDENTE) ? PENDENTE[orig] : nomePosicao(orig);
  const campo = orig => '<input class="ed" type="text" maxlength="80" data-orig="' + escAttr(orig) + '" value="' + escAttr(valorEd(orig)) + '">';
  c.grupos.forEach(([titulo, itens]) => {
    cartoes += '<div class="secao">' + (EDITANDO ? campo(titulo) : esc(nomePosicao(titulo))) + '<div class="faixa"></div></div>';
    itens.forEach(([funcao, nomes, dica]) => {
      const minha = ehMinha(nomes);
      if(minha) minhas.push(nomePosicao(funcao));
      const rotulo = EDITANDO
        ? campo(funcao) + (nomePosicao(funcao) !== funcao ? '<span class="orig">original: ' + esc(funcao) + '</span>' : '')
        : esc(nomePosicao(funcao));
      cartoes += '<div class="card' + (minha ? " sua" : "") + '"><div class="funcao">' + rotulo + (dica ? '<small>' + esc(dica) + '</small>' : '') + '</div>' +
                 '<div class="nomes">' + nomesHTML(nomes) + '</div></div>';
    });
  });
  if(minhas.length){
    html += '<div class="minha"><b>Sua função neste culto</b><span>' + minhas.map(esc).join(" · ") + '</span>' +
            '<br>Chegue às ' + c.chegada + '. Os cartões em verde são os seus.</div>';
  }
  html += cartoes +
    '<div class="aviso">' + (c.avisos || AVISOS).map(esc).join("<br>") + '</div>' +
    '<div class="lideranca"><b>' + esc(LIDERANCA) + '</b></div>';
  document.getElementById("conteudo").innerHTML = html;
}

function montarSeletor(){
  const agora = new Date();
  const cx = document.getElementById("cultos");
  cx.innerHTML = ESCALAS.map((c, i) => {
    const p = c.data.split("-");
    return '<button type="button"' + (fimDoCulto(c) < agora ? ' class="passou"' : '') + ' onclick="montar(' + i + ')">' +
           '<small>' + c.curto + '</small><b>' + p[2] + '/' + p[1] + '</b><i>' + c.hora + '</i></button>';
  }).join("");
  /* abre no próximo culto que ainda não aconteceu */
  let i = ESCALAS.findIndex(c => fimDoCulto(c) >= agora);
  montar(i < 0 ? ESCALAS.length - 1 : i);
}

/* ---------- Início: exige login (obreiro e liderança veem a escala) ---------- */
(async function(){
  const perfil = await exigirLogin();
  if(!perfil) return;
  montarBarraUsuario();
  if(EH_LIDER()) document.getElementById("voltar").style.display = "block";
  if(typeof ESCALAS === "undefined"){   /* config.js antigo em cache */
    document.getElementById("conteudo").innerHTML = "<p style='text-align:center; color:var(--texto-suave); font-size:.85rem; padding:30px 10px;'>Atualize a página para carregar a escala.</p>";
    return;
  }
  await carregarNomesPosicoes();
  montarSeletor();
})();
</script>

<script>
/* Logo: remove o fundo cinza (mantém cruz + brilho) */
(function(){
  const img = document.getElementById("logo-img");
  let feito = false;
  function processa(){
    if(feito) return;
    try{
      const c = document.createElement("canvas");
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0);
      const d = ctx.getImageData(0, 0, c.width, c.height), p = d.data;
      let minX = c.width, minY = c.height, maxX = 0, maxY = 0;
      for(let i = 0; i < p.length; i += 4){
        const mx = Math.max(p[i], p[i+1], p[i+2]), mn = Math.min(p[i], p[i+1], p[i+2]);
        const a = Math.max(0, Math.min(255, (mx - mn - 6) * 2.2));
        p[i+3] = a;
        if(a > 40){
          const px = (i/4) % c.width, py = Math.floor((i/4) / c.width);
          if(px < minX) minX = px; if(px > maxX) maxX = px;
          if(py < minY) minY = py; if(py > maxY) maxY = py;
        }
      }
      if(maxX <= minX || maxY <= minY) return;
      ctx.putImageData(d, 0, 0);
      const pad = 40;
      const sx = Math.max(0, minX - pad), sy = Math.max(0, minY - pad);
      const sw = Math.min(c.width, maxX + pad) - sx, sh = Math.min(c.height, maxY + pad) - sy;
      const c2 = document.createElement("canvas");
      c2.width = sw; c2.height = sh;
      c2.getContext("2d").drawImage(c, sx, sy, sw, sh, 0, 0, sw, sh);
      feito = true; img.onload = null;
      img.src = c2.toDataURL("image/png");
      img.classList.add("recortada");
    }catch(e){}
  }
  if(img.complete && img.naturalWidth > 0) processa(); else img.onload = processa;
})();
</script>
