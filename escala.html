<html lang="pt-BR">
<head>

<style>
  :root{
    --laranja:#F0834A; --laranja-claro:#F9A56E; --laranja-escuro:#D96A32;
    --preto:#0B0B0D; --preto-card:#151518; --cinza-borda:#2A2A2F;
    --branco:#F7F3EE; --texto-suave:#B8B2AA; --verde:#3DBB7A; --vermelho:#E05555;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--preto); color:var(--branco);
    font-family:'Poppins',system-ui,sans-serif; min-height:100vh;
    background-image:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(240,131,74,.18), transparent 60%);
  }

  /* Cabeçalho compacto: logo e título lado a lado */
  .hero{display:flex; align-items:center; gap:14px; max-width:600px; margin:0 auto; padding:16px 18px 0;}
  .hero .logo{
    width:64px; height:64px; flex:none; object-fit:cover; object-position:50% 45%;
    border-radius:50%; border:1px solid rgba(240,131,74,.4); box-shadow:0 0 28px rgba(240,131,74,.28);
  }
  .hero .logo.recortada{width:auto; height:64px; max-width:84px; object-fit:contain; border-radius:0; border:none; box-shadow:none;}
  .hero h1{font-family:'Playfair Display',serif; font-weight:800; font-size:clamp(1.25rem,5vw,1.7rem); letter-spacing:1px; line-height:1.15;}
  .hero h1 span{color:var(--laranja);}
  .hero .lema{color:var(--texto-suave); font-size:.66rem; letter-spacing:2.5px; text-transform:uppercase; margin-top:4px; font-weight:300;}

  main{max-width:600px; margin:0 auto; padding:14px 18px 50px;}

  /* Seletor dos cultos da semana */
  .cultos{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .cultos button{
    background:var(--preto-card); border:1px solid var(--cinza-borda); border-radius:14px; padding:10px 6px 9px;
    color:var(--texto-suave); font-family:'Poppins',sans-serif; cursor:pointer; text-align:center; line-height:1.2;
  }
  .cultos button small{display:block; font-size:.62rem; letter-spacing:1.5px; text-transform:uppercase;}
  .cultos button b{display:block; font-size:1.05rem; color:var(--branco); margin:2px 0 1px;}
  .cultos button i{display:block; font-style:normal; font-size:.7rem;}
  .cultos button.ativo{border-color:var(--laranja); background:linear-gradient(160deg, rgba(240,131,74,.22), var(--preto-card) 65%); color:var(--laranja);}
  .cultos button.ativo b{color:var(--laranja-claro);}
  .cultos button.passou{opacity:.55;}

  .titulo-culto{text-align:center; margin:16px 0 10px;}
  .titulo-culto b{display:block; font-family:'Playfair Display',serif; font-size:1.25rem;}
  .titulo-culto span{font-size:.72rem; color:var(--texto-suave); letter-spacing:2px; text-transform:uppercase;}

  .infos{display:flex; gap:6px; flex-wrap:wrap;}
  .infos .chip{
    flex:1 1 100%; background:var(--preto-card); border:1px solid var(--cinza-borda); border-radius:12px;
    padding:8px 12px; font-size:.72rem; color:var(--texto-suave); text-align:center; line-height:1.45;
  }
  .infos .chip b{color:var(--branco); display:inline; margin-right:5px; font-size:.72rem;}

  .minha{
    margin-top:10px; background:linear-gradient(135deg, rgba(61,187,122,.2), var(--preto-card) 60%);
    border:1px solid rgba(61,187,122,.6); border-radius:14px; padding:12px 16px; font-size:.82rem; line-height:1.5;
  }
  .minha b{color:var(--verde); display:block; font-size:.66rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:3px;}
  .minha span{color:var(--branco); font-weight:600;}

  .secao{
    font-family:'Playfair Display',serif; color:var(--laranja); font-size:1rem;
    margin:22px 4px 10px; text-align:center; letter-spacing:.5px;
  }
  .faixa{background:linear-gradient(90deg,transparent,var(--laranja),transparent); height:1px; max-width:300px; margin:6px auto 0; opacity:.5;}

  .card{
    background:var(--preto-card); border:1px solid var(--cinza-borda);
    border-radius:14px; padding:11px 14px; margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center; gap:14px;
  }
  .card.sua{border-color:rgba(61,187,122,.6); background:linear-gradient(120deg, rgba(61,187,122,.12), var(--preto-card) 55%);}
  .card .funcao{font-size:.7rem; font-weight:600; color:var(--laranja); text-transform:uppercase; letter-spacing:1.3px; flex:1; line-height:1.35;}
  .card .funcao small{display:block; text-transform:none; letter-spacing:0; font-weight:300; color:var(--texto-suave); font-size:.68rem; margin-top:2px;}
  .card .nomes{flex:1.3; text-align:right; font-size:.88rem; font-weight:600; line-height:1.45;}
  .card .nomes small{display:block; font-weight:300; color:var(--texto-suave); font-size:.72rem;}
  .casal{
    display:inline-block; background:rgba(240,131,74,.12); border:1px solid rgba(240,131,74,.35);
    color:var(--laranja-claro); border-radius:999px; padding:1px 9px;
    font-size:.64rem; font-weight:600; margin-left:5px; vertical-align:middle;
  }
  .todos{color:var(--laranja); letter-spacing:2px;}
  .aviso{
    background:rgba(224,85,85,.08); border:1px solid rgba(224,85,85,.3);
    color:#EFA0A0; border-radius:12px; padding:12px 16px; font-size:.76rem;
    text-align:center; margin-top:14px; line-height:1.6;
  }
  .lideranca{text-align:center; margin-top:14px; font-size:.74rem; color:var(--texto-suave); line-height:1.6;}
  .lideranca b{color:var(--branco);}
  .voltar{
    display:block; text-align:center; margin:26px auto 0; max-width:280px;
    padding:13px; border:1px solid var(--laranja); border-radius:999px;
    color:var(--laranja); text-decoration:none; font-weight:600; font-size:.85rem; letter-spacing:1px;
  }
  .voltar:hover{background:rgba(240,131,74,.1);}
  /* ---- Edição dos nomes das posições (só liderança) ---- */
  .btn-editar-nomes{
    display:block; margin:12px auto 0; padding:9px 18px; border-radius:999px; cursor:pointer;
    border:1px dashed var(--laranja); background:transparent; color:var(--laranja); font:600 .76rem 'Poppins',sans-serif;
  }
  .nomes .vago{font-style:italic; font-weight:400; color:var(--texto-suave);}
  .minha .de-todos{display:block; margin-top:8px; font-size:.74rem; color:var(--texto-suave);}
  .minha.fora{border-color:var(--cinza-borda); background:var(--preto-card);}
  .minha.fora b{color:var(--texto-suave);}
  .btn-editar-nomes.pdf{border-style:solid; border-color:var(--verde); color:var(--verde); background:rgba(61,187,122,.08);}
  .msg-pdf{text-align:center; font-size:.74rem; color:var(--verde); margin-top:8px;}
  .acoes-escala{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:12px;}
  .acoes-escala .btn-editar-nomes{margin:0;}
  .btn-editar-nomes.auto{border-style:solid; background:rgba(240,131,74,.12);}
  .barra-edicao .be-auto{margin-top:6px; color:var(--verde); font-weight:600;}
  .barra-edicao .be-auto button{flex:none; width:auto; margin-left:6px; padding:5px 10px; font-size:.68rem; border:1px solid var(--verde); background:transparent; color:var(--verde); border-radius:999px;}
  .barra-edicao{
    position:sticky; top:60px; z-index:20; margin-top:12px; padding:10px 12px; border-radius:14px;
    background:#1D1D22; border:1px solid var(--laranja); box-shadow:0 8px 26px rgba(0,0,0,.5);
    font-size:.72rem; color:var(--texto-suave); line-height:1.45;
  }
  .barra-edicao b{color:var(--laranja-claro);}
  .barra-edicao .be-btns{display:flex; gap:8px; margin-top:8px;}
  .barra-edicao button{flex:1; padding:10px; border-radius:10px; cursor:pointer; font:700 .76rem 'Poppins',sans-serif; letter-spacing:.5px;}
  .barra-edicao .be-salvar{border:none; color:#fff; background:linear-gradient(135deg, var(--laranja), var(--laranja-escuro));}
  .barra-edicao .be-cancelar{border:1px solid var(--cinza-borda); background:transparent; color:var(--texto-suave);}
  .barra-edicao button:disabled{opacity:.6;}
  .barra-edicao .be-msg{margin-top:6px; color:var(--vermelho);}
  input.ed{
    width:100%; padding:8px 10px; border:1px solid var(--laranja); border-radius:10px; background:#0F0F12;
    color:var(--branco); font:600 .8rem 'Poppins',sans-serif; text-transform:none; letter-spacing:0;
  }
  input.ed:focus{outline:none; box-shadow:0 0 0 2px rgba(240,131,74,.35);}
  .secao input.ed{text-align:center; font-family:'Playfair Display',serif; font-size:.95rem; color:var(--laranja-claro);}
  .card .orig{display:block; font-size:.62rem; color:var(--texto-suave); text-transform:none; letter-spacing:0; font-weight:300; margin-top:3px;}
  .card.editando{flex-direction:column; align-items:stretch; gap:8px;}
  .card.editando .nomes{text-align:left;}
  .card .nomes label.ed-rot{display:block; font-size:.6rem; color:var(--texto-suave); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:4px; font-weight:600;}
  .sel-p{display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px; border:1px solid rgba(61,187,122,.55);
    border-radius:12px; background:#0F0F12;}
  .chip-p{display:inline-flex; align-items:center; gap:2px; padding:5px 4px 5px 12px; border-radius:999px; font-size:.86rem; font-weight:600;
    background:rgba(61,187,122,.14); border:1px solid rgba(61,187,122,.5); color:var(--branco);}
  .chip-p.esp{background:rgba(240,131,74,.14); border-color:rgba(240,131,74,.55); color:var(--laranja);}
  .chip-p button{border:none; background:none; color:var(--texto-suave); font-size:1.05rem; line-height:1; padding:2px 8px; cursor:pointer;}
  .add-p, .lado-p select{font:600 .82rem 'Poppins',sans-serif; color:var(--verde); background:transparent; border:1px dashed rgba(61,187,122,.65);
    border-radius:999px; padding:7px 12px; max-width:100%;}
  .add-p{flex:1 1 170px;}
  .add-p option, .lado-p select option{color:#111;}
  .lado-p{display:flex; align-items:center; gap:8px; width:100%;}
  .lado-p span{flex:none; width:52px; font-size:.7rem; color:var(--texto-suave); text-transform:uppercase; letter-spacing:1px;}
  .lado-p select{flex:1; border-style:solid; color:var(--branco);}
  textarea.ed-p{
    width:100%; padding:8px 10px; border:1px solid var(--verde); border-radius:10px; background:#0F0F12; resize:vertical;
    color:var(--branco); font:600 .84rem 'Poppins',sans-serif; line-height:1.4;
  }
  textarea.ed-p:focus{outline:none; box-shadow:0 0 0 2px rgba(61,187,122,.35);}
  .salvo-ok{
    margin-top:12px; padding:10px 12px; border-radius:12px; text-align:center; font-size:.78rem; font-weight:600;
    background:rgba(61,187,122,.12); border:1px solid rgba(61,187,122,.4); color:var(--verde);
  }

  footer{text-align:center; padding:26px 20px 36px; color:var(--texto-suave); font-size:.7rem; letter-spacing:2px; text-transform:uppercase; font-weight:300;}
  footer span{color:var(--laranja);}

  @media (max-width:520px){
    .hero{padding:14px 14px 0; gap:12px;}
    .hero .logo{width:56px; height:56px;}
    .hero .logo.recortada{width:auto; height:56px; max-width:74px;}
    main{padding:12px 12px 40px;}
    .card{flex-direction:column; align-items:flex-start; gap:4px;}
    .card .nomes{text-align:left; font-size:.85rem;}
  }
</style>

<script>
/* ================================================================
   Escala da semana da Equipe 02 (dom 18h → qua 19h30 → dom 9h).
   Os dados (ESCALAS) ficam no config.js, porque o Início do devocional
   e o painel da liderança também usam as datas. Para publicar a próxima
   escala, troque ESCALAS lá (a mesma lista do Excel/PDF da pasta ALIANÇADOS).
   ================================================================ */
const LIDERANCA = "Líderes: Clebson e Letícia · Colíderes: Antônio e Laura";
const AVISOS = [
  "Não se aglomerar perto da mesa de apoio: é corredor de acesso aos banheiros e ao gabinete.",
  "Distribuam-se por toda a lateral e fundo da igreja. Evitar conversas paralelas.",
  "Não permitir que crianças fiquem correndo, orientando sempre os pais quando ocorrer.",
  "Horário de chegada: 1 hora antes do culto."
];
/* ---------- Ajustes da escala feitos pela liderança ----------
   Ficam numa linha reservada da tabela do devocional (data 2000-01-01, livro "__config_escala__").
   O plano devocional ignora essa linha, porque só mostra leituras a partir de INICIO_PLANO.
   Assim a liderança ajusta a escala pelo app, sem nenhuma mudança no banco.
   posicoes: nome original da posição -> nome novo (vale em todos os cultos)
   pessoas:  "data|seção|posição" -> quem serve (vale só naquele culto) */
const CONFIG_ESCALA = { data: "2000-01-01", livro: "__config_escala__" };
let NOMES_POSICOES = {}, NOMES_PESSOAS = {}, PADRAO_PESSOAS = {};
let EDITANDO = false, CULTO_ATUAL = 0, PENDENTE = {}, PENDENTE_P = {}, SALVO_AGORA = false, AUTO_INFO = "";
async function carregarNomesPosicoes(){
  try{
    const { data } = await sb.from("devocional").select("referencia")
      .eq("data", CONFIG_ESCALA.data).eq("livro", CONFIG_ESCALA.livro).maybeSingle();
    const m = data && data.referencia ? JSON.parse(data.referencia) : {};
    const ok = x => (x && typeof x === "object" && !Array.isArray(x)) ? x : {};
    if(m && m.v === 2){ NOMES_POSICOES = ok(m.posicoes); NOMES_PESSOAS = ok(m.pessoas); }
    else{ NOMES_POSICOES = ok(m); NOMES_PESSOAS = {}; }   /* formato antigo: só nomes das posições */
  }catch(e){ NOMES_POSICOES = {}; NOMES_PESSOAS = {}; }
}
function nomePosicao(n){ return NOMES_POSICOES[n] || n; }
/* Quem serve e escala automática: toda a liderança. Nome das posições: só o administrador (Antonio).
   (O banco confere de novo em salvar_ajustes_escala.) A Letícia segue liberada pelo nome até virar líder no banco. */
function podeEditarNomes(){
  return !!(PERFIL && PERFIL.nome && ((typeof EH_LIDER === "function" && EH_LIDER()) || ["antonio", "leticia"].includes(normal(PERFIL.nome))));
}
function podeEditarPosicoes(){ return !!(PERFIL && PERFIL.nome && typeof EH_ADMIN === "function" && EH_ADMIN()); }
function chavePessoas(c, titulo, funcao){ return c.data + "|" + titulo + "|" + funcao; }
async function salvarAjustes(posicoes, pessoas){
  /* caminho normal: a função do banco confere quem pode e protege os nomes de posição */
  const r = await sb.rpc("salvar_ajustes_escala", { p_posicoes: posicoes, p_pessoas: pessoas });
  if(!r.error) return;
  const faltaFuncao = r.error.code === "PGRST202" || /could not find the function/i.test(r.error.message || "");
  if(!faltaFuncao) throw r.error;
  /* reserva enquanto a função não existir: grava direto (só a liderança consegue) */
  const { error } = await sb.from("devocional").upsert({
    data: CONFIG_ESCALA.data, livro: CONFIG_ESCALA.livro, capitulo: 0,
    referencia: JSON.stringify({ v: 2, posicoes, pessoas }), nome: "__config__", testamento: "NOVO"
  }, { onConflict: "data" });
  if(error) throw error;
}
/* guarda o que foi digitado antes de trocar de culto ou salvar */
function guardarDigitado(){
  document.querySelectorAll("#conteudo input.ed").forEach(inp => { PENDENTE[inp.dataset.orig] = inp.value; });
  document.querySelectorAll("#conteudo .sel-p").forEach(el => { PENDENTE_P[el.dataset.chave] = el.dataset.valor; });
}
function editarNomes(){ EDITANDO = true; PENDENTE = {}; PENDENTE_P = {}; SALVO_AGORA = false; AUTO_INFO = ""; montar(CULTO_ATUAL); }
function cancelarEdicao(){ EDITANDO = false; PENDENTE = {}; PENDENTE_P = {}; AUTO_INFO = ""; montar(CULTO_ATUAL); }
async function salvarEdicao(btn){
  guardarDigitado();
  const mapa = Object.assign({}, NOMES_POSICOES);
  Object.keys(PENDENTE).forEach(orig => {
    const novo = String(PENDENTE[orig] || "").trim();
    if(!novo || novo === orig) delete mapa[orig]; else mapa[orig] = novo;
  });
  const pessoas = Object.assign({}, NOMES_PESSOAS);
  Object.keys(PENDENTE_P).forEach(ch => {
    const novo = String(PENDENTE_P[ch] || "").replace(/\s+/g, " ").trim();
    if(!novo || novo === PADRAO_PESSOAS[ch]) delete pessoas[ch]; else pessoas[ch] = novo;
  });
  btn.disabled = true; btn.textContent = "salvando...";
  try{
    await salvarAjustes(mapa, pessoas);
    NOMES_POSICOES = mapa; NOMES_PESSOAS = pessoas; EDITANDO = false; PENDENTE = {}; PENDENTE_P = {}; SALVO_AGORA = true; AUTO_INFO = "";
    montar(CULTO_ATUAL);
  }catch(err){
    btn.disabled = false; btn.textContent = "SALVAR";
    const m = document.querySelector(".barra-edicao .be-msg");
    if(m) m.textContent = /SEM_PERMISSAO|row-level|permission/i.test((err && err.message) || "")
      ? "Seu usuário ainda não tem permissão para salvar a escala. Fale com o Antonio."
      : "Não deu para salvar agora. Confira a internet e tente de novo.";
  }
}
function escAttr(s){ return esc(s).replace(/"/g, "&quot;"); }

/* ======================= PDF DO CULTO (só liderança) =======================
   Desenha no aparelho (jsPDF) o culto aberto, com os nomes ajustados pela liderança,
   e abre o compartilhamento (WhatsApp). No computador, baixa e abre o WhatsApp. */
function pdfDoCulto(){
  const m = document.getElementById("msg-pdf");
  if(!podeEditarNomes()) return;
  if(!window.jspdf){ if(m) m.textContent = "Sem internet para montar o PDF agora. Tente de novo em instantes."; return; }
  const c = ESCALAS[CULTO_ATUAL];
  const d = c.data.split("-");
  const titulo = c.dia + ", " + d[2] + "/" + d[1] + " · " + c.hora;
  /* tenta caber em 1 página: letra e espaço um pouco menores e, por último, sem as descrições das funções */
  const tentativas = [[1, true], [0.92, true], [0.85, true], [0.95, false], [0.86, false], [0.8, false]];
  let doc = null;
  for(const [k, comDica] of tentativas){ doc = desenharPdfCulto(c, titulo, k, comDica); if(doc.getNumberOfPages() === 1) break; }

  const nome = "Escala-Efraim-" + c.curto + "-" + d[2] + "-" + d[1] + "-" + c.hora.replace(/[^0-9h]/g, "") + ".pdf";
  const texto = "Escala · " + titulo + " · " + c.culto + " · Equipe 02 Efraim";
  let arq = null;
  try{ arq = new File([doc.output("blob")], nome, { type: "application/pdf" }); }catch(e){}
  if(arq && navigator.canShare && navigator.canShare({ files: [arq] }) && navigator.share){
    navigator.share({ files: [arq], title: texto, text: texto }).catch(e => { if(e && e.name !== "AbortError") baixarPdfCulto(doc, nome, texto); });
  }else baixarPdfCulto(doc, nome, texto);
}
/* k = fator de tamanho (letra e espaços); comDica = mostra a descrição de cada função */
function desenharPdfCulto(c, titulo, k, comDica){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4", compress: true });
  const W = 595, H = 842, M = 36, larg = W - 2 * M;
  const LAR = [240, 131, 74], ESC = [30, 30, 30], CIN = [115, 115, 115];
  const cabecalho = continua => {
    doc.setFillColor(...LAR); doc.rect(0, 0, W, 66, "F");
    doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(9);
    doc.text("EQUIPE 02 EFRAIM · ALIANÇADOS · ESCALA DE OBREIROS", M, 21);

/* ======================= ESCALA AUTOMÁTICA =======================
   Monta quem serve em cada posição do culto aberto:
   - tira quem respondeu NÃO naquele dia (quem não respondeu entra);
   - casais juntos; gazofilácios e banheiro masculino só homens; banheiro feminino só mulheres;
   - reservados com Letícia e Laura; acompanhar o pregador e nave com casais;
   - ninguém fica sem posição; mesmo número de pessoas por posição que a escala de modelo.
   Não salva sozinha: preenche os campos para conferir e tocar em SALVAR. */
const EQUIPE_ESCALA = [   /* [nome, sexo, cônjuge] */
  ["Clebson","M","Letícia"], ["Letícia","F","Clebson"], ["Antônio","M","Laura"], ["Laura","F","Antônio"],
  ["José Luis","M","Marina Corrêa"], ["Marina Corrêa","F","José Luis"], ["Reinaldo","M","Cristiane"], ["Cristiane","F","Reinaldo"],
  ["Hamilton","M","Miss Layne"], ["Miss Layne","F","Hamilton"], ["Jackson","M","Thays"], ["Thays","F","Jackson"],
  ["Igor","M"], ["Denilson","M"], ["Felipe Bianchezzi","M"], ["Marco Maia","M"], ["José Eduardo","M"], ["Jesus","M"],
  ["Alessandra","F"], ["Kátia","F"], ["Jaqueline","F"], ["Jugleyde Pompeo","F"], ["Martina Mendes","F"],
  ["Daiane Colman","F"], ["Simone","F"], ["Valéria","F"], ["Renata","F"], ["Milene","F"], ["Jhuli","F"], ["Patrícia","F"]
];
function vagasDe(padrao){
  if(padrao === "TODOS" || padrao === "Liderança") return 0;
  if(/Lado D:/.test(padrao)) return 2;
  return padrao.replace(/\(casal\)/g, "").split(/,| e /).map(x => x.trim()).filter(Boolean).length;
}
function regraDe(funcao){
  const f = normal(funcao);
  if(f.includes("gazofil")) return { sexo: "M", lados: true };
  if(f.includes("maquinas da primicia")) return { sexo: "M" };   /* o marido; a esposa fica na caixa */
  if(f.includes("caixa da primicia")) return { sexo: "F" };
  if(f.includes("banheiro masculino")) return { sexo: "M" };
  if(f.includes("banheiro feminino")) return { sexo: "F" };
  if(f.includes("reservados")) return { preferir: ["Letícia", "Laura"] };
  if(f.includes("backstage")) return { preferir: ["Patrícia"], soPreferido: true };   /* só a Patrícia; se ela não puder, fica vago */
  if(f.includes("acompanhar o pregador") || f.includes("nave da igreja")) return { casal: true };
  return {};
}
/* tipo de posição para o rodízio (banheiro feminino e masculino contam como "banheiro", os dois gazofilácios como um só) */
function tipoPosicao(funcao){
  const f = normal(funcao);
  if(f.includes("banheiro feminino") || f.includes("banheiro masculino")) return "banheiro";
  if(f.includes("gazofil")) return "gazofilacio";
  if(f.includes("primicia")) return "primicia";
  return f;
}
/* nos OUTROS cultos desta escala (o que está salvo, ou o original): tipo → nomes que já estão nele */
function ocupadosNosOutros(iAtual, fonte){
  const mapa = {};
  ESCALAS.forEach((c, i) => {
    if(i === iAtual) return;
    c.grupos.forEach(([titulo, itens]) => itens.forEach(([funcao, padrao]) => {
      const ch = chavePessoas(c, titulo, funcao);
      const nomes = fonte ? fonte[ch] : (NOMES_PESSOAS[ch] || padrao);
      if(!nomes || nomes === "TODOS" || nomes === "Liderança") return;
      const t = tipoPosicao(funcao);
      const set = mapa[t] || (mapa[t] = new Set());
      nomes.replace(/Lado [DE]:/g, ",").replace(/\(casal\)/g, "").split(/,| e |·/).map(x => normal(x)).filter(Boolean).forEach(n => set.add(n));
    }));
  });
  return mapa;
}
function embaralhar(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function formatarPessoas(ps, regra){
  if(regra.lados) return "Lado D: " + (ps[0] ? ps[0][0] : "") + " · Lado E: " + (ps[1] ? ps[1][0] : "");
  const usados = new Set(), partes = [];
  ps.forEach(p => {
    if(usados.has(p[0])) return;
    const par = p[2] && ps.find(y => y[0] === p[2]);
    if(par){ partes.push(p[0] + " e " + par[0] + " (casal)"); usados.add(par[0]); } else partes.push(p[0]);
    usados.add(p[0]);
  });
  if(partes.length <= 1) return partes[0] || "";
  if(partes.some(x => x.includes("(casal)"))) return partes.join(", ");
  return partes.slice(0, -1).join(", ") + " e " + partes[partes.length - 1];
}
async function lerDisponibilidade(isos){

}
function montarPropostaAutomatica(c, disponiveis, ocupados){
  ocupados = ocupados || {};
  const cont = {}; disponiveis.forEach(p => { cont[p[0]] = 0; });
  /* pode ficar nesta posição sem repetir o que já faz nos outros cultos? */
  const semRepetir = (v, x) => !(ocupados[v.tipo] && ocupados[v.tipo].has(normal(x[0])));
  const vagas = [];
  c.grupos.forEach(([titulo, itens]) => itens.forEach(([funcao, padrao]) => {
    const n = /banheiro (feminino|masculino)/.test(normal(funcao)) ? 2 : vagasDe(padrao);   /* banheiro: sempre 2 */
    if(n) vagas.push({ ch: chavePessoas(c, titulo, funcao), titulo, funcao, tipo: tipoPosicao(funcao), n, regra: regraDe(funcao), ordem: vagas.length, pessoas: [] });
  }));
  const restrita = v => (v.regra.sexo || v.regra.preferir || v.regra.casal) ? 0 : 1;
  const fila = vagas.slice().sort((a, b) => (restrita(a) - restrita(b)) || (a.ordem - b.ordem));
  const achar = nome => disponiveis.find(x => x[0] === nome);
  const exclusivos = new Set();   /* quem está numa posição exclusiva (Backstage) */
  /* primícia: marido nas máquinas e a esposa na caixa (casal com menos posições primeiro) */
  const vMaq = vagas.find(v => normal(v.funcao).includes("maquinas da primicia"));
  const vCaixa = vagas.find(v => normal(v.funcao).includes("caixa da primicia"));
  if(vMaq && vCaixa){
    const todosCasais = disponiveis.filter(x => x[1] === "M" && x[2] && achar(x[2]));
    const novos = todosCasais.filter(x => semRepetir(vMaq, x) && semRepetir(vCaixa, achar(x[2])));   /* rodízio */
    const casais = embaralhar(novos.length ? novos : todosCasais)
                     .sort((a, b) => (cont[a[0]] + cont[a[2]]) - (cont[b[0]] + cont[b[2]]));
    if(casais.length){
      const marido = casais[0], esposa = achar(marido[2]);
      vMaq.pessoas.push(marido); vCaixa.pessoas.push(esposa);
      cont[marido[0]]++; cont[esposa[0]]++;
      vMaq.pronta = vCaixa.pronta = true;
    }
  }
  fila.forEach(v => {
    if(v.pronta) return;
    const esc = v.pessoas;
    (v.regra.preferir || []).forEach(nm => { const p = achar(nm); if(p && esc.length < v.n && !esc.includes(p)) esc.push(p); });
    if(v.regra.soPreferido){ esc.forEach(p => { cont[p[0]]++; exclusivos.add(p[0]); }); return; }   /* ninguém entra no lugar; quem está aqui não pega outra posição */
    while(esc.length < v.n){
      const todos = disponiveis.filter(p => !esc.includes(p) && !exclusivos.has(p[0]) && (!v.regra.sexo || p[1] === v.regra.sexo));
      /* rodízio: não repete a posição dos outros cultos, nem pega duas do mesmo tipo neste culto (ex.: os dois gazofilácios) */
      const jaNoTipo = x => vagas.some(w => w !== v && w.tipo === v.tipo && w.pessoas.includes(x));
      const novos = todos.filter(x => semRepetir(v, x) && !jaNoTipo(x));
      const cand = embaralhar(novos.length ? novos : todos).sort((a, b) => cont[a[0]] - cont[b[0]]);
      if(!cand.length) break;
      let p = cand[0];
      const livre = x => cont[x[0]] <= cont[p[0]];   /* não repete ninguém enquanto houver gente com menos posições */
      if(v.regra.casal && esc.length + 1 < v.n){
        const c2 = cand.find(x => x[2] && livre(x) && achar(x[2]) && !esc.includes(achar(x[2])) && livre(achar(x[2])));
        if(c2) p = c2;
      }
      esc.push(p);
      if(!v.regra.sexo && p[2] && esc.length < v.n){ const par = achar(p[2]); if(par && !esc.includes(par) && cont[par[0]] <= cont[p[0]] && semRepetir(v, par) && !jaNoTipo(par)) esc.push(par); }
    }
    esc.forEach(p => { cont[p[0]]++; });
  });
  /* ninguém sem posição: quem sobrou vai para as laterais / fundo com menos gente */
  disponiveis.filter(p => !cont[p[0]]).forEach(p => {
    const alvo = vagas.filter(v => !v.regra.sexo && !v.regra.lados && v.titulo !== "Funções")
                      .sort((a, b) => (semRepetir(b, p) - semRepetir(a, p)) || (vagas.some(w => w !== a && w.tipo === a.tipo && w.pessoas.includes(p)) - vagas.some(w => w !== b && w.tipo === b.tipo && w.pessoas.includes(p))) || (a.pessoas.length - b.pessoas.length))[0];
    if(alvo){ alvo.pessoas.push(p); cont[p[0]]++; }
  });
  const res = {};
  vagas.forEach(v => { res[v.ch] = v.pessoas.length ? formatarPessoas(v.pessoas, v.regra) : "Vago"; });
  /* quantos ficaram repetindo a posição (só quando não havia outra pessoa possível) */
  Object.defineProperty(res, "repeticoes", { value: vagas.reduce((t, v) => t + v.pessoas.filter(x => !semRepetir(v, x) && !(v.regra.preferir || []).includes(x[0])).length, 0), enumerable: false });
  return res;
}

    Object.assign(proposta, r);

}

      const ch = chavePessoas(c, titulo, funcao);
      PADRAO_PESSOAS[ch] = padrao;
      const nomes = NOMES_PESSOAS[ch] || padrao;          /* quem serve: o ajuste da liderança ou o da escala */
      const minha = ehMinha(nomes);
      if(minha) minhas.push(nomePosicao(funcao));
      const rotulo = edPos
        ? campo(funcao) + (nomePosicao(funcao) !== funcao ? '<span class="orig">original: ' + esc(funcao) + '</span>' : '')
        : esc(nomePosicao(funcao));
      const valorP = (ch in PENDENTE_P) ? PENDENTE_P[ch] : nomes;
      const blocoNomes = EDITANDO
        ? '<label class="ed-rot">Quem serve</label><div class="sel-p" data-chave="' + escAttr(ch) + '" data-funcao="' + escAttr(funcao) + '" data-valor="' + escAttr(valorP) + '"></div>' +
          (nomes !== padrao ? '<span class="orig">na escala original: ' + esc(padrao) + '</span>' : '')
        : nomesHTML(nomes);
      lista.push({ minha, todos: nomes === "TODOS", funcao: nomePosicao(funcao),
        html: '<div class="card' + (minha && !EDITANDO ? " sua" : "") + (EDITANDO ? " editando" : "") + '"><div class="funcao">' + rotulo + (dica ? '<small>' + esc(dica) + '</small>' : '') + '</div>' +
              '<div class="nomes">' + blocoNomes + '</div></div>' });
    });
  });
  /* obreiro: só os cartões dele; as tarefas de TODOS viram uma linha no quadro "Sua função"; seção sem cartão some */
  let cartoes = "";
  const deTodos = [];
  secoes.forEach(([cab, lista]) => {
    if(!veTudo) lista.forEach(x => { if(x.todos && !x.minha) deTodos.push(x.funcao); });
    const mostrar = veTudo ? lista : lista.filter(x => x.minha);
    if(mostrar.length) cartoes += cab + mostrar.map(x => x.html).join("");
  });
  if(!veTudo && !minhas.length){
    cartoes = '<div class="minha fora"><b>Neste culto</b><span>Você não está na escala.</span><br>Se acha que deveria estar, fale com a liderança.</div>';
  }
  if(minhas.length){
    html += '<div class="minha"><b>Sua função neste culto</b><span>' + minhas.map(esc).join(" · ") + '</span>' +
            '<br>Chegue às ' + c.chegada + '.' + (veTudo ? ' Os cartões em verde são os seus.' : '') +
            (!veTudo && deTodos.length ? '<small class="de-todos">Todos participam: ' + deTodos.map(esc).join(", ") + '.</small>' : '') + '</div>';
  }
  html += cartoes +
    '<div class="aviso">' + (c.avisos || AVISOS).map(esc).join("<br>") + '</div>' +
    '<div class="lideranca"><b>' + esc(LIDERANCA) + '</b></div>';
  document.getElementById("conteudo").innerHTML = html;
  if(EDITANDO) montarSeletoresP();
}

/* ======================= ESCOLHER QUEM SERVE (sem digitar) ======================= */
const ESPECIAIS_P = ["TODOS", "Liderança", "Vago"];
/* "A e B (casal), C" → [A, B, C] · "Lado D: X · Lado E: Y" → [X, Y] */
function nomesDoValor(v){
  v = String(v || "").trim();
  if(!v) return [];
  if(ESPECIAIS_P.includes(v)) return [v];
  if(/Lado D:/.test(v)){
    const d = (v.match(/Lado D:\s*([^·]*)/) || [])[1] || "", e = (v.match(/Lado E:\s*(.*)$/) || [])[1] || "";
    return [d.trim(), e.trim()];
  }
  return v.replace(/\(casal\)/g, "").split(/,| e /).map(x => x.trim()).filter(Boolean);
}
function pessoaDaEquipe(nome){ return EQUIPE_ESCALA.find(p => normal(p[0]) === normal(nome)) || [nome, "?"]; }
function valorDosNomes(nomes, lados){
  if(lados) return "Lado D: " + (nomes[0] || "") + " · Lado E: " + (nomes[1] || "");
  const esp = nomes.find(n => ESPECIAIS_P.includes(n));
  if(esp) return esp;
  if(!nomes.length) return "Vago";                       /* tirou todo mundo: fica vago (vazio voltaria ao original) */
  return formatarPessoas(nomes.map(pessoaDaEquipe), {});  /* marca "(casal)" sozinho */
}
/* quem já está em outra posição deste culto (para avisar na lista) */
function escaladosNoCulto(c, exceto){
  const usados = new Set();
  c.grupos.forEach(([t, itens]) => itens.forEach(([f, padrao]) => {
    const ch = chavePessoas(c, t, f);
    if(ch === exceto) return;
    const v = (ch in PENDENTE_P) ? PENDENTE_P[ch] : (NOMES_PESSOAS[ch] || padrao);
    nomesDoValor(v).forEach(n => { if(n && !ESPECIAIS_P.includes(n)) usados.add(normal(n)); });
  }));
  return usados;
}
function montarSeletoresP(){
  const c = ESCALAS[CULTO_ATUAL];
  document.querySelectorAll("#conteudo .sel-p").forEach(el => desenharSeletorP(el, c));
}
function desenharSeletorP(el, c){
  const lados = !!regraDe(el.dataset.funcao).lados;
  const nomes = nomesDoValor(el.dataset.valor);
  const usados = escaladosNoCulto(c, el.dataset.chave);
  const equipe = EQUIPE_ESCALA.map(p => p[0]).sort((a, b) => a.localeCompare(b, "pt-BR", { sensitivity: "base" }));
  const opcao = (n, sel) => '<option value="' + escAttr(n) + '"' + (sel ? " selected" : "") + '>' + esc(n) + (usados.has(normal(n)) ? "  · já escalado" : "") + '</option>';
  if(lados){
    el.innerHTML = ["Lado D", "Lado E"].map((rot, i) =>
      '<label class="lado-p"><span>' + rot + '</span><select data-i="' + i + '"><option value="">escolher…</option>' +
      equipe.map(n => opcao(n, !!nomes[i] && normal(n) === normal(nomes[i]))).join("") + '</select></label>').join("");
    el.querySelectorAll("select").forEach(sel => { sel.onchange = () => atualizarP(el, valorDosNomes([...el.querySelectorAll("select")].map(x => x.value), true)); });
    return;
  }
  const livres = equipe.filter(n => !nomes.some(x => normal(x) === normal(n)));
  el.innerHTML = nomes.map((n, i) => '<span class="chip-p' + (ESPECIAIS_P.includes(n) ? " esp" : "") + '">' + esc(n === "Vago" ? "vago" : n) +
      '<button type="button" data-i="' + i + '" aria-label="tirar ' + escAttr(n) + '">×</button></span>').join("") +
    '<select class="add-p"><option value="">+ adicionar obreiro</option>' +
      '<optgroup label="Equipe">' + livres.map(n => opcao(n, false)).join("") + '</optgroup>' +
      '<optgroup label="Outros">' + ESPECIAIS_P.filter(x => !nomes.includes(x)).map(x => '<option value="' + x + '">' + (x === "Vago" ? "Deixar vago" : x) + '</option>').join("") + '</optgroup>' +
    '</select>';
  el.querySelectorAll(".chip-p button").forEach(b => { b.onclick = () => atualizarP(el, valorDosNomes(nomes.filter((_, i) => i !== +b.dataset.i), false)); });
  el.querySelector(".add-p").onchange = e => {
    const n = e.target.value;
    if(!n) return;
    atualizarP(el, valorDosNomes(ESPECIAIS_P.includes(n) ? [n] : nomes.filter(x => !ESPECIAIS_P.includes(x)).concat(n), false));
  };
}
function atualizarP(el, valor){
  el.dataset.valor = valor;
  PENDENTE_P[el.dataset.chave] = valor;
  montarSeletoresP();   /* redesenha todos: o aviso "já escalado" acompanha */
}

function montarSeletor(){
  const agora = new Date();
  const cx = document.getElementById("cultos");
  cx.innerHTML = ESCALAS.map((c, i) => {
    const p = c.data.split("-");
    return '<button type="button"' + (fimDoCulto(c) < agora ? ' class="passou"' : '') + ' onclick="montar(' + i + ')">' +
           '<small>' + c.curto + '</small><b>' + p[2] + '/' + p[1] + '</b><i>' + c.hora + '</i></button>';
  }).join("");
  /* abre no próximo culto que ainda não aconteceu */
  let i = ESCALAS.findIndex(c => fimDoCulto(c) >= agora);
  montar(i < 0 ? ESCALAS.length - 1 : i);
}

/* ---------- Início: exige login (obreiro e liderança veem a escala) ---------- */
(async function(){
  const perfil = await exigirLogin();
  if(!perfil) return;
  montarBarraUsuario();
  if(EH_LIDER()) document.getElementById("voltar").style.display = "block";
  if(typeof ESCALAS === "undefined"){   /* config.js antigo em cache */
    document.getElementById("conteudo").innerHTML = "<p style='text-align:center; color:var(--texto-suave); font-size:.85rem; padding:30px 10px;'>Atualize a página para carregar a escala.</p>";
    return;
  }
  await carregarNomesPosicoes();
  montarSeletor();
})();
</script>

<script>
/* Logo: remove o fundo cinza (mantém cruz + brilho) */
(function(){
  const img = document.getElementById("logo-img");
  let feito = false;
  function processa(){
    if(feito) return;
    try{
      const c = document.createElement("canvas");
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0);
      const d = ctx.getImageData(0, 0, c.width, c.height), p = d.data;
      let minX = c.width, minY = c.height, maxX = 0, maxY = 0;
      for(let i = 0; i < p.length; i += 4){
        const mx = Math.max(p[i], p[i+1], p[i+2]), mn = Math.min(p[i], p[i+1], p[i+2]);
        const a = Math.max(0, Math.min(255, (mx - mn - 6) * 2.2));
        p[i+3] = a;
        if(a > 40){
          const px = (i/4) % c.width, py = Math.floor((i/4) / c.width);
          if(px < minX) minX = px; if(px > maxX) maxX = px;
          if(py < minY) minY = py; if(py > maxY) maxY = py;
        }
      }
      if(maxX <= minX || maxY <= minY) return;
      ctx.putImageData(d, 0, 0);
      const pad = 40;
      const sx = Math.max(0, minX - pad), sy = Math.max(0, minY - pad);
      const sw = Math.min(c.width, maxX + pad) - sx, sh = Math.min(c.height, maxY + pad) - sy;
      const c2 = document.createElement("canvas");
      c2.width = sw; c2.height = sh;
      c2.getContext("2d").drawImage(c, sx, sy, sw, sh, 0, 0, sw, sh);
      feito = true; img.onload = null;
      img.src = c2.toDataURL("image/png");
      img.classList.add("recortada");
    }catch(e){}
  }
  if(img.complete && img.naturalWidth > 0) processa(); else img.onload = processa;
})();
</script>
