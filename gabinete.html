<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B0B0D">
<meta name="robots" content="noindex,nofollow">
<title>Gabinete — Equipe Efraim | Aliançados</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="EQUIPE EFRAIM">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,500&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --laranja:#F0834A; --laranja-claro:#F9A56E; --laranja-escuro:#D96A32;
    --preto:#0B0B0D; --preto-card:#151518; --cinza-borda:#2A2A2F;
    --branco:#F7F3EE; --texto-suave:#B8B2AA; --verde:#3DBB7A; --vermelho:#E05555; --azul:#4FA3E8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--preto); color:var(--branco); font-family:'Poppins',system-ui,sans-serif; min-height:100vh;
    background-image:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(240,131,74,.18), transparent 60%);
  }
  .hero{display:flex; align-items:center; gap:14px; max-width:600px; margin:0 auto; padding:16px 18px 0;}
  .hero .ico{width:58px; height:58px; flex:none; filter:drop-shadow(0 0 18px rgba(79,163,232,.3));}
  .hero .ico svg{width:100%; height:100%; display:block;}
  .hero h1{font-family:'Playfair Display',serif; font-weight:800; font-size:clamp(1.3rem,5.6vw,1.75rem); letter-spacing:1px; line-height:1.15;}
  .hero h1 span{color:var(--laranja);}
  .hero .lema{color:var(--texto-suave); font-size:.66rem; letter-spacing:2.5px; text-transform:uppercase; margin-top:4px; font-weight:300;}
  main{max-width:600px; margin:0 auto; padding:16px 18px 40px;}

  .abas{display:flex; gap:6px; margin-bottom:14px;}
  .abas button{flex:1; padding:10px 8px; border-radius:12px; border:1px solid var(--cinza-borda); background:var(--preto-card);
    color:var(--texto-suave); font:600 .78rem 'Poppins',sans-serif; cursor:pointer;}
  .abas button.ativo{background:var(--laranja); border-color:var(--laranja); color:#fff;}

  .card{background:var(--preto-card); border:1px solid var(--cinza-borda); border-radius:16px; padding:14px 16px; margin-bottom:12px;}
  .novo{border-color:rgba(79,163,232,.55); background:linear-gradient(160deg, rgba(79,163,232,.1), var(--preto-card) 60%);}
  .novo h2{font-size:.72rem; letter-spacing:2px; text-transform:uppercase; color:var(--azul); margin-bottom:10px;}
  .campos{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .campos .todo{grid-column:1 / -1;}
  .campos label{display:block; font-size:.62rem; color:var(--texto-suave); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:4px; font-weight:600;}
  .campos input, .campos select{width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--cinza-borda); background:#0F0F12;
    color:var(--branco); font:500 .9rem 'Poppins',sans-serif; color-scheme:dark;}
  .campos input:focus, .campos select:focus{outline:none; border-color:var(--azul);}
  .fim-auto{padding:11px 12px; border-radius:10px; border:1px dashed var(--cinza-borda); color:var(--texto-suave); font:600 .9rem 'Poppins',sans-serif;}
  .btn{width:100%; margin-top:12px; padding:13px; border:none; border-radius:12px; cursor:pointer; color:#fff;
    background:linear-gradient(135deg, var(--laranja), var(--laranja-escuro)); font:700 .85rem 'Poppins',sans-serif; letter-spacing:1px;}
  .btn:disabled{opacity:.6;}
  .msg{font-size:.78rem; margin-top:8px; min-height:1em; color:var(--texto-suave);}
  .msg.erro{color:var(--vermelho);} .msg.ok{color:var(--verde);}

  .dia{display:flex; align-items:center; gap:10px; margin:18px 2px 8px; font-size:.7rem; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--laranja);}
  .dia::after{content:""; flex:1; height:1px; background:linear-gradient(90deg, rgba(240,131,74,.5), transparent);}
  .dia.hoje{color:var(--verde);} .dia.hoje::after{background:linear-gradient(90deg, rgba(61,187,122,.5), transparent);}
  .horario{display:flex; align-items:center; gap:12px; background:var(--preto-card); border:1px solid var(--cinza-borda); border-radius:14px; padding:11px 14px; margin-bottom:8px;}
  .horario .hora{min-width:78px; font-weight:700; font-size:1rem; font-variant-numeric:tabular-nums;}
  .horario .hora small{display:block; font-weight:400; font-size:.7rem; color:var(--texto-suave);}
  .horario .quem{flex:1; min-width:0;}
  .horario .quem b{display:block; font-size:.92rem;}
  .horario .quem span{display:block; font-size:.75rem; color:var(--texto-suave); overflow-wrap:anywhere;}
  .horario .tag{flex:none; font-size:.6rem; letter-spacing:1px; text-transform:uppercase; padding:3px 8px; border-radius:999px; border:1px solid rgba(61,187,122,.5); color:var(--verde);}
  .horario .tirar{flex:none; background:none; border:1px solid var(--cinza-borda); color:var(--texto-suave); border-radius:999px; padding:6px 10px; font:600 .68rem 'Poppins',sans-serif; cursor:pointer;}
  .horario .tirar:hover{border-color:var(--vermelho); color:var(--vermelho);}
  /* calendário do mês */
  .cal{background:var(--preto-card); border:1px solid var(--cinza-borda); border-radius:16px; padding:12px 12px 10px; margin-bottom:12px;}
  .cal-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .cal-top b{font-family:'Playfair Display',serif; font-size:1.1rem; text-transform:capitalize;}
  .cal-top button{width:36px; height:36px; border-radius:50%; border:1px solid var(--cinza-borda); background:transparent; color:var(--branco); font-size:1.1rem; cursor:pointer;}
  .cal-top button:disabled{opacity:.25; cursor:default;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; margin-top:10px;}
  .cal-sem{font-size:.58rem; color:var(--texto-suave); text-align:center; text-transform:uppercase; letter-spacing:1px; padding:2px 0 4px;}
  .cal-dia{aspect-ratio:1/1; border-radius:10px; border:1px solid transparent; background:#1D1D22; color:var(--branco);
    font:600 .85rem 'Poppins',sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; padding:0;}
  .cal-dia.fora{visibility:hidden;}
  .cal-dia.passado{opacity:.32; cursor:default;}
  .cal-dia.hoje{border-color:var(--verde); color:var(--verde);}
  .cal-dia.sel{background:var(--laranja); border-color:var(--laranja); color:#fff;}
  .cal-dia .pts{display:flex; gap:3px; height:6px;}
  .pt{width:6px; height:6px; border-radius:50%; display:inline-block;}
  .pt.joel{background:var(--azul);} .pt.vilma{background:#C58BFF;}
  .cal-leg{display:flex; gap:14px; justify-content:center; font-size:.68rem; color:var(--texto-suave); margin-top:8px; flex-wrap:wrap;}
  .cal-leg span{display:inline-flex; align-items:center; gap:5px;}
  .filtro-dia{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 2px 0; font-size:.78rem; color:var(--texto-suave);}
  .filtro-dia button{background:none; border:none; color:var(--laranja); font:600 .75rem 'Poppins',sans-serif; cursor:pointer; text-decoration:underline;}
  .horario.joel{border-left:4px solid var(--azul);} .horario.vilma{border-left:4px solid #C58BFF;}
  .meu-ag{border-color:rgba(240,131,74,.6); background:linear-gradient(160deg, rgba(240,131,74,.14), var(--preto-card) 60%);}
  .meu-ag h2{font-size:.72rem; letter-spacing:2px; text-transform:uppercase; color:var(--laranja); margin-bottom:8px;}
  .meu-ag .linha{font-size:.95rem; font-weight:600; line-height:1.5;}
  .meu-ag .linha small{display:block; font-weight:400; font-size:.78rem; color:var(--texto-suave);}
  .dica-ag{font-size:.8rem; color:var(--texto-suave); margin:0 2px 12px; line-height:1.5;}
  .horario .agendar{flex:none; border:none; border-radius:999px; padding:8px 14px; cursor:pointer; color:#fff;
    background:linear-gradient(135deg, var(--laranja), var(--laranja-escuro)); font:700 .72rem 'Poppins',sans-serif; letter-spacing:.5px;}
  .horario .agendar:disabled{opacity:.6;}
  .horario .tag.ocupado{border-color:rgba(240,131,74,.6); color:var(--laranja);}
  .horario .tag.seu{border-color:rgba(240,131,74,.6); color:var(--laranja); background:rgba(240,131,74,.12);}
  .horario .acoes-h{display:flex; flex-direction:column; gap:6px; align-items:flex-end; flex:none;}
  .horario.marcado{background:linear-gradient(120deg, rgba(240,131,74,.1), var(--preto-card) 55%);}
  .vazio{font-size:.85rem; color:var(--texto-suave); line-height:1.6; text-align:center; padding:26px 10px;}
  .restrito{text-align:center; padding:40px 16px; color:var(--texto-suave); line-height:1.6;}
  .restrito b{display:block; color:var(--branco); font-size:1.05rem; margin-bottom:6px;}
  @media (max-width:520px){ .hero{padding:14px 14px 0; gap:12px;} main{padding:12px 12px 36px;} .campos{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>

<div class="hero">
  <span class="ico" id="ico"></span>
  <div>
    <h1>GABI<span>NETE</span></h1>
    <div class="lema">Horários disponíveis dos pastores</div>
  </div>
</div>

<main>
  <div id="conteudo"><p class="vazio">Carregando...</p></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
let HORARIOS = [], FILTRO = "todos", DIA_SEL = null;
let MES = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
const MESES_G = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const classePastor = p => /joel/i.test(p) ? "joel" : "vilma";
/* minutos desde 0h; horário sem fim conta 1 hora */
const minutos = t => { const [h, m] = String(t).split(":").map(Number); return h * 60 + m; };
const fimMin = h => h.hora_fim ? minutos(h.hora_fim) : minutos(h.hora) + 60;
function conflitoCom(pastor, data, hora, fim){
  const ini = minutos(hora), fm = fim ? minutos(fim) : ini + 60;
  return HORARIOS.find(h => h.pastor === pastor && h.data === data && ini < fimMin(h) && minutos(h.hora) < fm) || null;
}
const DURACAO_MIN = 60;   /* todo atendimento dura 1 hora */
const PRIMEIRO_INICIO = "07:00", ULTIMO_INICIO = "22:00", PASSO_MIN = 30, DIAS_A_FRENTE = 60;
const DIA_SEM = ["dom","seg","ter","qua","qui","sex","sáb"];
/* horários de início livres para o pastor no dia: não cruzam com nenhum outro e, hoje, ainda não passaram */
function horariosLivres(pastor, data){
  const agora = new Date(), hoje = hojeISO(), minAgora = agora.getHours() * 60 + agora.getMinutes();
  const livres = [];
  for(let t = minutos(PRIMEIRO_INICIO); t <= minutos(ULTIMO_INICIO); t += PASSO_MIN){
    const hh = String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
    if(data === hoje && t <= minAgora) continue;
    if(!conflitoCom(pastor, data, hh, maisUmaHora(hh))) livres.push(hh);
  }
  return livres;
}
function diasLivres(pastor){
  const d0 = new Date(); d0.setHours(12, 0, 0, 0);
  const dias = [];
  for(let i = 0; i <= DIAS_A_FRENTE; i++){
    const d = new Date(d0); d.setDate(d0.getDate() + i);
    const iso = isoDe(d);
    if(horariosLivres(pastor, iso).length) dias.push(iso);
  }
  return dias;
}
/* monta as listas do cadastro (dia → horários) conforme o pastor escolhido */
function preencherForm(manterHora){
  const selP = document.getElementById("g-pastor"), selD = document.getElementById("g-data"), selH = document.getElementById("g-hora");
  if(!selP || !selD || !selH) return;
  const pastor = selP.value, diaAntes = selD.value || DIA_SEL, horaAntes = manterHora ? selH.value : "";
  const dias = diasLivres(pastor);
  selD.innerHTML = dias.length ? dias.map(iso => { const p = iso.split("-"); const d = new Date(iso + "T12:00:00");
      return '<option value="' + iso + '">' + DIA_SEM[d.getDay()] + ", " + p[2] + "/" + p[1] + (iso === hojeISO() ? " · hoje" : "") + '</option>'; }).join("")
    : '<option value="">sem dias livres</option>';
  if(diaAntes && dias.includes(diaAntes)) selD.value = diaAntes;
  const horas = selD.value ? horariosLivres(pastor, selD.value) : [];
  selH.innerHTML = horas.length ? horas.map(h => '<option value="' + h + '">' + horaBR(h) + '</option>').join("") : '<option value="">sem horário livre</option>';
  if(horaAntes && horas.includes(horaAntes)) selH.value = horaAntes;
  const fimTxt = document.getElementById("g-fim");
  if(fimTxt) fimTxt.textContent = selH.value ? horaBR(maisUmaHora(selH.value)) : "—";
}
function maisUmaHora(hora){ const t = minutos(hora) + DURACAO_MIN; return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); }
function isoDe(d){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function calendarioHTML(){
  const hoje = hojeISO(), ano = MES.getFullYear(), mes = MES.getMonth();
  const primeiro = new Date(ano, mes, 1).getDay(), dias = new Date(ano, mes + 1, 0).getDate();
  const doMes = HORARIOS.filter(h => FILTRO === "todos" || h.pastor === FILTRO);   /* quem agenda já recebe só livres + o seu */
  const mesAtual = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
  let g = ["dom","seg","ter","qua","qui","sex","sáb"].map(x => '<div class="cal-sem">' + x + '</div>').join("");
  for(let i = 0; i < primeiro; i++) g += '<button type="button" class="cal-dia fora" tabindex="-1"></button>';
  for(let d = 1; d <= dias; d++){
    const iso = isoDe(new Date(ano, mes, d));
    const quem = [...new Set(doMes.filter(h => h.data === iso).map(h => classePastor(h.pastor)))];
    const cls = "cal-dia" + (iso < hoje ? " passado" : "") + (iso === hoje ? " hoje" : "") + (iso === DIA_SEL ? " sel" : "");
    g += '<button type="button" class="' + cls + '" data-iso="' + iso + '"' + (iso < hoje ? " disabled" : "") + '>' + d +
         '<span class="pts">' + quem.map(q => '<i class="pt ' + q + '"></i>').join("") + '</span></button>';
  }
  return '<div class="cal"><div class="cal-top"><button type="button" id="cal-ant"' + (MES <= mesAtual ? " disabled" : "") + ' aria-label="mês anterior">‹</button>' +
    '<b>' + MESES_G[mes] + ' ' + ano + '</b><button type="button" id="cal-prox" aria-label="próximo mês">›</button></div>' +
    '<div class="cal-grid">' + g + '</div>' +
    '<div class="cal-leg"><span><i class="pt joel"></i>Pr. Joel</span><span><i class="pt vilma"></i>Pra. Vilma</span></div></div>';
}
const DIAS = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
function escG(s){ return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function hojeISO(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function horaBR(t){ if(!t) return ""; const [h, m] = String(t).split(":"); return parseInt(h, 10) + "h" + m; }
function diaBR(iso){ const d = new Date(iso + "T12:00:00"); const p = iso.split("-"); return DIAS[d.getDay()] + ", " + p[2] + "/" + p[1]; }

const ehGestor = () => pastoresQuePosso().length > 0;
async function carregar(){
  if(ehGestor()){
    const { data, error } = await sb.from("gabinete_horarios").select("id,pastor,data,hora,hora_fim,obs,agendado_nome,assunto").gte("data", hojeISO()).order("data").order("hora");
    if(error) throw error;
    HORARIOS = data || [];
  }else if(podeAgendarGabinete()){
    const { data, error } = await sb.rpc("gabinete_para_mim");
    if(error) throw error;
    HORARIOS = Array.isArray(data) ? data : [];
  }else HORARIOS = [];
}

function montar(){
  if(!ehGestor() && podeAgendarGabinete()){ montarParaQuemAgenda(); return; }
  const cx = document.getElementById("conteudo");
  const posso = pastoresQuePosso();
  let html = '<div class="abas">' + [["todos", "Todos"], ["Pr. Joel", "Pr. Joel"], ["Pra. Vilma", "Pra. Vilma"]]
    .map(([f, rot]) => '<button type="button" data-f="' + escG(f) + '"' + (FILTRO === f ? ' class="ativo"' : '') + '>' + escG(rot) + '</button>').join("") + '</div>';
  const gestor = ehGestor(), agenda = !gestor && podeAgendarGabinete();
  if(agenda){
    const meus = HORARIOS.filter(h => h.meu);
    html += meus.length
      ? meus.map(h => '<div class="card meu-ag"><h2>📌 Agendado por você</h2><div class="linha">' + escG(diaBR(h.data)) + ' às ' + horaBR(h.hora) +
          '<small>com ' + escG(h.pastor) + (h.hora_fim ? ' · até ' + horaBR(h.hora_fim) : '') + (h.assunto ? ' · ' + escG(h.assunto) : '') + '</small></div>' +
          '<button type="button" class="btn" style="background:transparent;border:1px solid var(--cinza-borda);color:var(--texto-suave)" data-cancelar="' + h.id + '">cancelar agendamento</button></div>').join("")
      : '';
    html += '<p class="dica-ag">Escolha um horário livre abaixo e toque em <b>Agendar</b>.</p>';
  }
  html += calendarioHTML();

  /* cadastro: admin (os dois pastores) e cada pastor(a) a própria agenda */
  if(posso.length){
    html += '<div class="card novo"><h2>➕ Novo horário disponível</h2><div class="campos">' +
      '<div class="todo"><label for="g-pastor">Pastor(a)</label><select id="g-pastor"' + (posso.length === 1 ? ' disabled' : '') + '>' +
        posso.map(p => '<option' + (FILTRO === p ? ' selected' : '') + '>' + escG(p) + '</option>').join("") + '</select></div>' +
      '<div class="todo"><label for="g-data">Dia (só dias com horário livre)</label><select id="g-data"></select></div>' +
      '<div><label for="g-hora">Início (livre)</label><select id="g-hora"></select></div>' +
      '<div><label>Fim (1 hora)</label><div class="fim-auto" id="g-fim">10h00</div></div>' +
      '<div class="todo"><label for="g-obs">Observação (opcional)</label><input type="text" id="g-obs" maxlength="120" placeholder="Ex.: presencial no gabinete, online, para casais"></div>' +
      '</div><button type="button" class="btn" id="g-add">ADICIONAR HORÁRIO</button><div class="msg" id="g-msg"></div></div>';
  }

  const lista = HORARIOS.filter(h => (FILTRO === "todos" || h.pastor === FILTRO) && (!DIA_SEL || h.data === DIA_SEL));
  /* horário que cruza com um agendamento seu (você não fica em dois lugares ao mesmo tempo) */
  const cruzaComMeu = h => HORARIOS.some(m => m.meu && m.id !== h.id && m.data === h.data && minutos(h.hora) < fimMin(m) && minutos(m.hora) < fimMin(h));
  if(DIA_SEL) html += '<div class="filtro-dia"><span>Mostrando ' + escG(diaBR(DIA_SEL)) + '</span><button type="button" id="ver-todos-dias">ver todos os dias</button></div>';
  if(!lista.length){
    html += '<p class="vazio">Nenhum horário ' + (gestor ? 'cadastrado' : 'livre') + (FILTRO === "todos" ? '' : ' para ' + escG(FILTRO)) + ' por enquanto.' +
            (posso.length ? '<br>Use o quadro acima para cadastrar.' : '') + '</p>';
  }else{
    let diaAtual = "";
    const hoje = hojeISO();
    lista.forEach(h => {
      if(h.data !== diaAtual){ diaAtual = h.data; html += '<div class="dia' + (h.data === hoje ? ' hoje' : '') + '">' + escG(diaBR(h.data)) + (h.data === hoje ? ' · hoje' : '') + '</div>'; }
      const tira = posso.includes(h.pastor);
      const marcado = gestor ? !!h.agendado_nome : !!h.meu;
      let direita;
      if(gestor){
        direita = '<div class="acoes-h">' + (h.agendado_nome ? '<span class="tag ocupado">agendado</span>' : '<span class="tag">livre</span>') +
          (tira && h.agendado_nome ? '<button type="button" class="tirar" data-cancelar="' + h.id + '">liberar</button>' : '') +
          (tira ? '<button type="button" class="tirar" data-id="' + h.id + '">remover</button>' : '') + '</div>';
      }else if(agenda){
        direita = h.meu ? '<span class="tag seu">seu horário</span>'
                        : (cruzaComMeu(h) ? '<span class="tag">você já tem outro nesse horário</span>'
                                          : '<button type="button" class="agendar" data-agendar="' + h.id + '">Agendar</button>');
      }else direita = '<span class="tag">disponível</span>';
      const detalhe = gestor && h.agendado_nome ? '<span>👤 ' + escG(h.agendado_nome) + (h.assunto ? ' · ' + escG(h.assunto) : '') + '</span>' : (h.obs ? '<span>' + escG(h.obs) + '</span>' : '');
      html += '<div class="horario ' + classePastor(h.pastor) + (marcado ? ' marcado' : '') + '"><div class="hora">' + horaBR(h.hora) + (h.hora_fim ? '<small>até ' + horaBR(h.hora_fim) + '</small>' : '') + '</div>' +
        '<div class="quem"><b>' + escG(h.pastor) + '</b>' + detalhe + (gestor && h.agendado_nome && h.obs ? '<span>' + escG(h.obs) + '</span>' : '') + '</div>' + direita + '</div>';
    });
  }
  cx.innerHTML = html;

  cx.querySelectorAll(".abas button").forEach(b => { b.onclick = () => { FILTRO = b.dataset.f; montar(); }; });
  cx.querySelectorAll(".cal-dia[data-iso]").forEach(b => { b.onclick = () => { if(b.disabled) return; DIA_SEL = DIA_SEL === b.dataset.iso ? null : b.dataset.iso; montar(); }; });
  const ant = document.getElementById("cal-ant"), prox = document.getElementById("cal-prox"), todos = document.getElementById("ver-todos-dias");
  if(ant) ant.onclick = () => { MES = new Date(MES.getFullYear(), MES.getMonth() - 1, 1); montar(); };
  if(prox) prox.onclick = () => { MES = new Date(MES.getFullYear(), MES.getMonth() + 1, 1); montar(); };
  if(todos) todos.onclick = () => { DIA_SEL = null; montar(); };
  cx.querySelectorAll(".tirar[data-id]").forEach(b => { b.onclick = () => remover(+b.dataset.id, b); });
  cx.querySelectorAll("[data-cancelar]").forEach(b => { b.onclick = () => cancelarAgendamento(+b.dataset.cancelar, b); });
  cx.querySelectorAll("[data-agendar]").forEach(b => { b.onclick = () => agendar(+b.dataset.agendar, b); });
  const add = document.getElementById("g-add");
  if(add) add.onclick = adicionar;
  const selP = document.getElementById("g-pastor"), selD = document.getElementById("g-data"), selH = document.getElementById("g-hora");
  if(selP && selD && selH){
    preencherForm(false);
    selP.onchange = () => preencherForm(false);
    selD.onchange = () => { DIA_SEL = selD.value || null; preencherForm(false); };
    selH.onchange = () => { const f = document.getElementById("g-fim"); if(f) f.textContent = selH.value ? horaBR(maisUmaHora(selH.value)) : "—"; };
  }
}

/* ======================= TELA DE QUEM AGENDA =======================
   Quadro "Agendar horário" (só horários livres) + calendário + só os agendamentos da própria pessoa. */
function livresParaMim(){
  const agora = new Date(), hoje = hojeISO(), minAgora = agora.getHours() * 60 + agora.getMinutes();
  const meus = HORARIOS.filter(h => h.meu);
  const cruza = h => meus.some(m => m.data === h.data && minutos(h.hora) < fimMin(m) && minutos(m.hora) < fimMin(h));
  return HORARIOS.filter(h => !h.meu && !cruza(h) && (h.data > hoje || minutos(h.hora) > minAgora));
}
function montarParaQuemAgenda(){
  const cx = document.getElementById("conteudo");
  const livres = livresParaMim(), meus = HORARIOS.filter(h => h.meu);
  const pastores = GABINETE_PASTORES.filter(p => livres.some(h => h.pastor === p));
  let html = '<div class="abas">' + [["todos", "Todos"], ["Pr. Joel", "Pr. Joel"], ["Pra. Vilma", "Pra. Vilma"]]
    .map(([f, rot]) => '<button type="button" data-f="' + escG(f) + '"' + (FILTRO === f ? ' class="ativo"' : '') + '>' + escG(rot) + '</button>').join("") + '</div>';
  html += '<div class="card novo"><h2>📅 Agendar horário</h2>';
  if(!pastores.length){
    html += '<p class="dica-ag" style="margin:0">Nenhum horário livre no momento. Assim que os pastores liberarem novos horários, eles aparecem aqui.</p></div>';
  }else{
    html += '<div class="campos">' +
      '<div class="todo"><label for="a-pastor">Com quem</label><select id="a-pastor">' +
        pastores.map(p => '<option' + (FILTRO === p ? ' selected' : '') + '>' + escG(p) + '</option>').join("") + '</select></div>' +
      '<div class="todo"><label for="a-data">Dia (só dias com horário livre)</label><select id="a-data"></select></div>' +
      '<div class="todo"><label for="a-hora">Horário livre</label><select id="a-hora"></select></div>' +
      '<div class="todo"><label for="a-assunto">Assunto (opcional, só o pastor vê)</label><input type="text" id="a-assunto" maxlength="120" placeholder="Ex.: aconselhamento, oração, conversa"></div>' +
      '</div><button type="button" class="btn" id="a-btn">AGENDAR</button><div class="msg" id="a-msg"></div></div>';
  }
  /* calendário: dias com horário livre */
  const guarda = HORARIOS; HORARIOS = livres; html += calendarioHTML(); HORARIOS = guarda;
  /* só os agendamentos da própria pessoa */
  html += '<div class="dia">Seus agendamentos</div>';
  html += meus.length ? meus.map(h => '<div class="horario ' + classePastor(h.pastor) + ' marcado"><div class="hora">' + horaBR(h.hora) +
        (h.hora_fim ? '<small>até ' + horaBR(h.hora_fim) + '</small>' : '') + '</div>' +
      '<div class="quem"><b>' + escG(h.pastor) + '</b><span>' + escG(diaBR(h.data)) + '</span>' + (h.assunto ? '<span>' + escG(h.assunto) + '</span>' : '') + '</div>' +
      '<div class="acoes-h"><span class="tag seu">agendado</span><button type="button" class="tirar" data-cancelar="' + h.id + '">cancelar</button></div></div>').join("")
    : '<p class="vazio">Você ainda não tem agendamento.</p>';
  cx.innerHTML = html;

  cx.querySelectorAll(".abas button").forEach(b => { b.onclick = () => { FILTRO = b.dataset.f; montar(); }; });
  cx.querySelectorAll(".cal-dia[data-iso]").forEach(b => { b.onclick = () => { if(b.disabled) return; DIA_SEL = DIA_SEL === b.dataset.iso ? null : b.dataset.iso; montar(); }; });
  const ant = document.getElementById("cal-ant"), prox = document.getElementById("cal-prox");
  if(ant) ant.onclick = () => { MES = new Date(MES.getFullYear(), MES.getMonth() - 1, 1); montar(); };
  if(prox) prox.onclick = () => { MES = new Date(MES.getFullYear(), MES.getMonth() + 1, 1); montar(); };
  cx.querySelectorAll("[data-cancelar]").forEach(b => { b.onclick = () => cancelarAgendamento(+b.dataset.cancelar, b); });
  const selP = document.getElementById("a-pastor"), selD = document.getElementById("a-data"), selH = document.getElementById("a-hora");
  if(selP && selD && selH){
    const preencher = () => {
      const doPastor = livres.filter(h => h.pastor === selP.value);
      const dias = [...new Set(doPastor.map(h => h.data))].sort();
      const diaAntes = selD.value || DIA_SEL;
      selD.innerHTML = dias.map(iso => { const pp = iso.split("-"); const d = new Date(iso + "T12:00:00");
        return '<option value="' + iso + '">' + DIA_SEM[d.getDay()] + ", " + pp[2] + "/" + pp[1] + (iso === hojeISO() ? " · hoje" : "") + '</option>'; }).join("");
      if(diaAntes && dias.includes(diaAntes)) selD.value = diaAntes;
      const horas = doPastor.filter(h => h.data === selD.value).sort((a, b) => minutos(a.hora) - minutos(b.hora));
      selH.innerHTML = horas.map(h => '<option value="' + h.id + '">' + horaBR(h.hora) + (h.hora_fim ? ' às ' + horaBR(h.hora_fim) : '') + '</option>').join("");
    };
    preencher();
    selP.onchange = () => { selD.value = ""; preencher(); };
    selD.onchange = () => { DIA_SEL = selD.value; preencher(); };
    document.getElementById("a-btn").onclick = agendarPeloQuadro;
  }
}
async function agendarPeloQuadro(){
  const msg = document.getElementById("a-msg"), btn = document.getElementById("a-btn");
  const id = +document.getElementById("a-hora").value, assunto = document.getElementById("a-assunto").value.trim();
  const h = HORARIOS.find(x => x.id === id);
  msg.className = "msg";
  if(!h){ msg.textContent = "Escolha um horário livre."; msg.classList.add("erro"); return; }
  btn.disabled = true; btn.textContent = "agendando...";
  const { error } = await sb.rpc("agendar_gabinete", { p_id: id, p_assunto: assunto });
  btn.disabled = false; btn.textContent = "AGENDAR";
  if(error){ msg.textContent = erroAg(error); msg.classList.add("erro"); await carregar(); montar(); const m = document.getElementById("a-msg"); if(m){ m.className = "msg erro"; m.textContent = erroAg(error); } return; }
  await carregar(); montar();
  const m = document.getElementById("a-msg");
  if(m){ m.className = "msg ok"; m.textContent = "Agendado com " + h.pastor + ": " + diaBR(h.data) + " às " + horaBR(h.hora) + "."; }
  else{ const cx = document.querySelector(".card.novo"); if(cx) cx.insertAdjacentHTML("beforeend", '<div class="msg ok">Agendado com ' + escG(h.pastor) + ': ' + escG(diaBR(h.data)) + ' às ' + horaBR(h.hora) + '.</div>'); }
}

async function adicionar(){
  const msg = document.getElementById("g-msg"), btn = document.getElementById("g-add");
  const pastor = document.getElementById("g-pastor").value, data = document.getElementById("g-data").value;
  const hora = document.getElementById("g-hora").value, obs = document.getElementById("g-obs").value.trim();
  const fim = hora ? maisUmaHora(hora) : "";
  msg.className = "msg";
  if(!pastor || !data || !hora){ msg.textContent = "Não há dia ou horário livre para cadastrar."; msg.classList.add("erro"); return; }
  if(data < hojeISO()){ msg.textContent = "Escolha hoje ou um dia à frente."; msg.classList.add("erro"); return; }
  if(hora > "23:00"){ msg.textContent = "O último horário possível começa às 23h00."; msg.classList.add("erro"); return; }
  const choque = conflitoCom(pastor, data, hora, fim);
  if(choque){
    msg.textContent = "Cruza com o horário de " + horaBR(choque.hora) + " às " + horaBR(choque.hora_fim || (String(Math.floor(fimMin(choque) / 60)).padStart(2, "0") + ":" + String(fimMin(choque) % 60).padStart(2, "0"))) +
                      " de " + pastor + " nesse dia. Escolha outro horário.";
    msg.classList.add("erro"); return;
  }
  btn.disabled = true; btn.textContent = "salvando...";
  const { error } = await sb.from("gabinete_horarios").insert({ pastor, data, hora, hora_fim: fim, obs: obs || null });
  btn.disabled = false; btn.textContent = "ADICIONAR HORÁRIO";
  if(error){
    const t = error.message || "";
    msg.textContent = /HORARIO_EM_CONFLITO/.test(t) ? "Esse horário cruza com outro já cadastrado para " + pastor + ". Escolha outro."
                    : /FIM_ANTES_DO_INICIO/.test(t) ? "O fim precisa ser depois do início."
                    : /row-level|permission|policy/i.test(t) ? "Seu usuário não pode cadastrar nessa agenda." : "Não deu para salvar agora. Tente de novo.";
    msg.classList.add("erro"); return;
  }
  DIA_SEL = data; MES = new Date(Number(data.slice(0, 4)), Number(data.slice(5, 7)) - 1, 1);
  await carregar(); montar();
  const m2 = document.getElementById("g-msg"); if(m2){ m2.className = "msg ok"; m2.textContent = "Horário de " + pastor + " cadastrado: " + diaBR(data) + " às " + horaBR(hora) + "."; }
}

const ERROS_AG = {
  VOCE_JA_TEM_NESSE_HORARIO: "Você já tem outro agendamento nesse mesmo horário.",
  JA_TEM_AGENDAMENTO: "Você já tem um agendamento. Cancele o atual antes de marcar outro.",
  HORARIO_OCUPADO: "Esse horário acabou de ser agendado por outra pessoa. Escolha outro.",
  HORARIO_PASSOU: "Esse horário já passou.",
  HORARIO_NAO_EXISTE: "Esse horário não existe mais. Atualize a página.",
  SEM_PERMISSAO: "Seu usuário ainda não pode agendar no Gabinete."
};
function erroAg(e){ const t = (e && e.message) || ""; const k = Object.keys(ERROS_AG).find(x => t.includes(x)); return k ? ERROS_AG[k] : "Não deu certo agora. Confira a internet e tente de novo."; }
async function agendar(id, btn){
  const h = HORARIOS.find(x => x.id === id);
  if(!h) return;
  const assunto = prompt("Agendar com " + h.pastor + "\n" + diaBR(h.data) + " às " + horaBR(h.hora) + (h.hora_fim ? " (até " + horaBR(h.hora_fim) + ")" : "") +
                         "\n\nAssunto (opcional, só o pastor vê):", "");
  if(assunto === null) return;
  btn.disabled = true; btn.textContent = "...";
  const { error } = await sb.rpc("agendar_gabinete", { p_id: id, p_assunto: assunto });
  if(error){ btn.disabled = false; btn.textContent = "Agendar"; alert(erroAg(error)); await carregar(); montar(); return; }
  await carregar(); montar();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
async function cancelarAgendamento(id, btn){
  const h = HORARIOS.find(x => x.id === id);
  if(!h) return;
  const quem = h.agendado_nome ? " de " + h.agendado_nome : "";
  if(!confirm("Cancelar o agendamento" + quem + " com " + h.pastor + " em " + diaBR(h.data) + " às " + horaBR(h.hora) + "?\n\nO horário volta a ficar livre.")) return;
  btn.disabled = true; btn.textContent = "...";
  const { error } = await sb.rpc("cancelar_agendamento_gabinete", { p_id: id });
  if(error){ btn.disabled = false; alert(erroAg(error)); return; }
  await carregar(); montar();
}

async function remover(id, btn){
  const h = HORARIOS.find(x => x.id === id);
  if(!h || !confirm("Remover o horário de " + h.pastor + " em " + diaBR(h.data) + " às " + horaBR(h.hora) + "?" + (h.agendado_nome ? "\n\nAtenção: " + h.agendado_nome + " tinha agendado esse horário." : ""))) return;
  btn.disabled = true; btn.textContent = "...";
  const { error } = await sb.from("gabinete_horarios").delete().eq("id", id);
  if(error){ btn.disabled = false; btn.textContent = "remover"; alert("Não deu para remover agora. Tente de novo."); return; }
  await carregar(); montar();
}

(async function(){
  const perfil = await exigirLogin();
  if(!perfil) return;
  document.getElementById("ico").innerHTML = iconeCor("gabinete");
  montarBarraUsuario();
  if(!podeVerGabinete()){
    document.getElementById("conteudo").innerHTML = '<div class="restrito"><b>O Gabinete ainda está em teste.</b>Em breve ele fica disponível para a equipe. 🙏</div>';
    return;
  }
  try{ await carregar(); montar(); }
  catch(e){ document.getElementById("conteudo").innerHTML = '<p class="vazio">Não deu para carregar os horários agora. Confira a internet e tente de novo.</p>'; }
})();
