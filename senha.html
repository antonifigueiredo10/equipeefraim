<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B0B0D">
<meta name="robots" content="noindex,nofollow">
<title>Crie sua senha — Equipe Efraim | Aliançados</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --laranja:#F0834A; --laranja-claro:#F9A56E; --laranja-escuro:#D96A32;
    --preto:#0B0B0D; --preto-card:#151518; --cinza-borda:#2A2A2F;
    --branco:#F7F3EE; --texto-suave:#B8B2AA; --verde:#3DBB7A; --vermelho:#E05555;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--preto); color:var(--branco); font-family:'Poppins',system-ui,sans-serif; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; padding:36px 18px;
    background-image:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(240,131,74,.18), transparent 60%);
  }
  .topo{text-align:center; margin-bottom:22px;}
  .topo .ic{font-size:2.6rem;}
  .topo h1{font-family:'Playfair Display',serif; font-weight:800; font-size:1.6rem; margin-top:8px;}
  .topo h1 span{color:var(--laranja);}
  .topo p{color:var(--texto-suave); font-size:.84rem; line-height:1.55; margin-top:8px; max-width:340px;}
  .topo p b{color:var(--branco);}
  .caixa{width:100%; max-width:400px; background:var(--preto-card); border:1px solid var(--cinza-borda); border-radius:20px; padding:22px;}
  label{display:block; font-size:.72rem; font-weight:600; color:var(--laranja); text-transform:uppercase; letter-spacing:1.5px; margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=password], input[type=text]{
    width:100%; padding:14px; border:1px solid var(--cinza-borda); border-radius:12px; background:#0F0F12;
    color:var(--branco); font-family:'Poppins',sans-serif; font-size:1rem;
  }
  input:focus{outline:none; border-color:var(--laranja);}
  .ver{display:flex; align-items:center; gap:8px; font-size:.74rem; color:var(--texto-suave); margin-top:10px; cursor:pointer; text-transform:uppercase; letter-spacing:1px;}
  button.principal{
    width:100%; margin-top:18px; padding:15px; border:none; border-radius:12px; cursor:pointer; color:#fff;
    background:linear-gradient(135deg, var(--laranja), var(--laranja-escuro)); font:700 .9rem 'Poppins',sans-serif; letter-spacing:1.5px;
    box-shadow:0 6px 24px rgba(240,131,74,.3);
  }
  button.principal:disabled{opacity:.6;}
  .msg{display:none; text-align:center; padding:12px; border-radius:12px; margin-top:14px; font-weight:600; font-size:.84rem; line-height:1.4;}
  .msg.ok{display:block; background:rgba(61,187,122,.12); border:1px solid rgba(61,187,122,.4); color:var(--verde);}
  .msg.erro{display:block; background:rgba(224,85,85,.12); border:1px solid rgba(224,85,85,.4); color:var(--vermelho);}
  .sair{display:block; text-align:center; margin-top:18px; color:var(--texto-suave); font-size:.76rem; text-decoration:underline; cursor:pointer; background:none; border:none; font-family:inherit;}
  footer{margin-top:auto; padding-top:30px; color:var(--texto-suave); font-size:.66rem; letter-spacing:2px; text-transform:uppercase;}
  footer span{color:var(--laranja);}
</style>
</head>
<body>

<div class="topo">
  <div class="ic">🔑</div>
  <h1>CRIE <span>SUA SENHA</span></h1>
  <p>Olá, <b id="quem">…</b>! Você entrou com a senha que a liderança te mandou. Antes de seguir, escolha uma senha <b>só sua</b>. É rápido e só precisa fazer uma vez.</p>
</div>

<form class="caixa" onsubmit="salvar(event)">
  <label for="s1">Senha nova</label>
  <input type="password" id="s1" placeholder="Mínimo de 6 caracteres" minlength="6" autocomplete="new-password" required>
  <label for="s2">Repita a senha nova</label>
  <input type="password" id="s2" placeholder="Digite de novo" minlength="6" autocomplete="new-password" required>
  <label class="ver"><input type="checkbox" onchange="document.getElementById('s1').type = document.getElementById('s2').type = this.checked ? 'text' : 'password'"> Mostrar senhas</label>
  <button type="submit" class="principal" id="btn">SALVAR E ENTRAR</button>
  <div id="msg" class="msg"></div>
  <button type="button" class="sair" onclick="sair()">Sair sem trocar (a senha recebida continua valendo)</button>
</form>

<footer>Aliançados · <span>Lugar de Crescimento</span> · 2026</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
function mostrar(tipo, texto){ const m = document.getElementById("msg"); m.className = "msg " + tipo; m.textContent = texto; }

async function salvar(ev){
  ev.preventDefault();
  const s1 = document.getElementById("s1").value, s2 = document.getElementById("s2").value;
  if(s1.length < 6){ mostrar("erro", "A senha precisa ter pelo menos 6 caracteres."); return; }
  if(s1 === "123456"){ mostrar("erro", "Essa é a senha inicial. Escolha uma diferente, só sua."); return; }
  if(s1 !== s2){ mostrar("erro", "As duas senhas não são iguais."); return; }
  const btn = document.getElementById("btn"); btn.disabled = true;
  const { error } = await sb.auth.updateUser({ password: s1 });
  if(error){ btn.disabled = false; mostrar("erro", "Não deu certo agora. Tente de novo em instantes."); return; }
  try{ await sb.rpc("senha_definida"); }catch(e){}
  mostrar("ok", "Senha criada! Entrando...");
  setTimeout(() => location.replace(paginaHome()), 700);
}

(async function(){
  const perfil = await exigirLogin();
  if(!perfil) return;
  document.getElementById("quem").textContent = perfil.nome.split(" ")[0];
})();
</script>
</body>
</html>
